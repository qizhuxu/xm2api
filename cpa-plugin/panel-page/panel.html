<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiMo 面板</title>
<style>
/* 兜底基础样式（克隆官方面板样式成功后以官方为准 —— 本块只在克隆失败时兜底）。
   视觉语言对齐 CPA 官方面板：同款按钮类（btn/btn-secondary/btn-danger）、
   细边框卡片、紧凑排版。 */
:root{
  --bg:#f6f7f9; --card:#ffffff; --border:rgba(15,23,42,.10); --text:#1e293b;
  --muted:#64748b; --accent:#3b82f6; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
}
:root[data-theme="dark"]{
  --bg:#111827; --card:#1f2937; --border:rgba(255,255,255,.10); --text:#e5e7eb;
  --muted:#9ca3af; --accent:#60a5fa; --ok:#34d399; --bad:#f87171; --warn:#fbbf24;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
.hidden{display:none!important}
header.bar{display:flex;align-items:center;gap:12px;padding:12px 22px;
  border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:20}
header.bar h1{margin:0;font-size:17px;font-weight:600}
header.bar .sp{flex:1}
main{padding:20px 22px 60px;max-width:1240px;margin:0 auto}
section{margin-bottom:22px}
section>h2{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.03em}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.grid{display:grid;gap:12px}
.grid.kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.kpi .v{font-size:24px;font-weight:650}
.kpi .l{color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font:inherit;font-size:13px;
  border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-danger{color:var(--bad)}
.btn-sm{padding:4px 9px;font-size:12px}
.btn svg{width:15px;height:15px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--muted);font-size:12px;font-weight:600}
input{font:inherit;padding:7px 11px;border:1px solid var(--border);border-radius:8px;
  background:var(--card);color:var(--text);width:100%}
.pill{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font-size:12px;
  border:1px solid var(--border)}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)}
.chart{width:100%;height:220px;display:block}
.ring{width:96px;height:96px;flex:none}
.toast{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast .it{padding:9px 15px;border-radius:9px;background:var(--card);border:1px solid var(--border);
  box-shadow:0 10px 28px rgba(0,0,0,.18)}
iframe{width:100%;height:540px;border:1px solid var(--border);border-radius:10px;background:#fff}
</style>
</head>
<body>

<header class="bar">
  <h1>MiMo 面板</h1>
  <span class="pill" id="key-pill">…</span>
  <span class="sp"></span>
  <button class="btn btn-sm" id="theme-btn">🌓 深浅色</button>
  <button class="btn btn-sm" id="relogin-btn">🔑 密钥</button>
  <button class="btn btn-primary btn-sm" id="refresh-all">↻ 刷新</button>
</header>

<div id="gate" class="hidden" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.45);z-index:50">
  <div class="card" style="width:min(420px,92vw)">
    <h2 style="margin:0 0 6px;font-size:18px">MiMo 面板</h2>
    <p class="muted" style="margin:0 0 16px">输入 CPA 管理密钥（X-Management-Key）；与官方面板同源时自动带出。</p>
    <input id="gate-key" type="password" placeholder="管理密钥" autocomplete="off">
    <div class="row" style="margin-top:14px"><button class="btn btn-primary" id="gate-go">进入面板</button>
    <span class="muted" id="gate-msg"></span></div>
  </div>
</div>

<main>
  <!-- 总览 -->
  <section>
    <h2>总览</h2>
    <div class="grid kpi" id="kpi"></div>
  </section>

  <!-- 用量 -->
  <section>
    <h2>用量</h2>
    <div class="grid two">
      <div class="card">
        <div class="row between"><b>额度趋势</b><span class="muted">每 10 分钟采样 · 悬浮看明细</span></div>
        <svg id="chart-line" class="chart" viewBox="0 0 640 220" preserveAspectRatio="none"></svg>
        <div id="line-legend" class="row" style="gap:14px"></div>
      </div>
      <div class="card">
        <div class="row between"><b>近 30 天请求量</b><span class="muted">成功 / 失败</span></div>
        <svg id="chart-bar" class="chart" viewBox="0 0 640 220" preserveAspectRatio="none"></svg>
        <div class="row" style="gap:14px"><span class="pill ok">■ 成功</span><span class="pill bad">■ 失败</span></div>
      </div>
    </div>
  </section>

  <!-- 账号（管理 + 额度一体） -->
  <section>
    <h2>账号</h2>
    <div class="row" style="margin-bottom:10px">
      <button class="btn btn-primary btn-sm" id="quota-refresh-all">↻ 全部刷新额度</button>
      <button class="btn btn-sm" id="login-new">＋ 在线登录小米账号</button>
      <span class="muted">额度默认不自动拉取；按钮或卡片刷新后显示</span>
    </div>
    <div class="grid cards" id="accounts"></div>
    <div id="login-box" class="card hidden" style="margin-top:12px">
      <div class="row between"><b>在线登录</b><span class="muted">扫码 / 账号密码 / 新设备验证码；密码不落盘不进日志</span></div>
      <div id="login-status" class="muted" style="margin:10px 0"></div>
      <iframe id="login-frame" class="hidden" title="MiMo 登录"></iframe>
    </div>
  </section>

  <!-- 模型 -->
  <section>
    <h2>模型</h2>
    <div class="card">
      <div class="row between"><b>模型清单</b><span class="muted" id="models-src"></span></div>
      <table><thead><tr><th>模型</th><th>类型</th><th>厂商</th></tr></thead><tbody id="models-body"></tbody></table>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ===== 样式对齐官方面板：隐藏 iframe 跑官方面板，克隆其运行时注入的 <style> ===== */
/* 官方面板的 CSS 是 CSS-in-JS 运行时注入（bundle 实测 css-loader），静态抄不全；
   同源 iframe 里跑一遍官方 bundle，把注入的 <style> 原样克隆过来 ⇒ 色板/按钮/
   卡片阴影等与官方面板逐字一致（不重复造轮子）。失败时上面的兜底样式仍然可用。 */
(function cloneOfficialStyles(){
  try{
    var f=document.createElement('iframe');
    f.style.cssText='position:fixed;width:0;height:0;border:0;visibility:hidden';
    f.src='/management.html';
    var tries=0;
    f.onload=function(){
      var t=setInterval(function(){
        tries++;
        try{
          var styles=f.contentDocument.querySelectorAll('style');
          if(styles.length){
            for(var i=0;i<styles.length;i++){
              var s=document.createElement('style');
              s.textContent=styles[i].textContent;
              s.setAttribute('data-mq-official','1');
              document.head.appendChild(s);
            }
            clearInterval(t); f.remove();
          }
        }catch(e){}
        if(tries>40){ clearInterval(t); f.remove(); }
      },250);
    };
    document.body.appendChild(f);
  }catch(e){}
})();

/* ===== 密钥与 API ===== */
var KEY = sessionStorage.getItem('mimo.panel.key') || localStorage.getItem('managementKey') || '';
function setKey(k){ KEY=k; try{ sessionStorage.setItem('mimo.panel.key',k); }catch(e){} }
function toast(msg){
  var box=document.getElementById('toast');
  var d=document.createElement('div');
  d.className='it'; d.textContent=msg;
  box.appendChild(d);
  setTimeout(function(){ d.remove(); },3600);
}
async function api(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({'Authorization':'Bearer '+KEY,'X-Management-Key':KEY,'content-type':'application/json'},opts.headers||{});
  var res=await fetch(path,opts);
  if(res.status===401||res.status===403){ showGate('密钥无效或已过期'); throw new Error('auth'); }
  var body=await res.json().catch(function(){ return {}; });
  if(!res.ok) throw new Error(body.message||body.error||('HTTP '+res.status));
  return body;
}
function showGate(msg){
  document.getElementById('gate').classList.remove('hidden');
  if(msg) document.getElementById('gate-msg').textContent=msg;
}
document.getElementById('gate-go').onclick=function(){
  var k=document.getElementById('gate-key').value.trim();
  if(!k) return;
  setKey(k);
  document.getElementById('gate').classList.add('hidden');
  boot();
};
document.getElementById('relogin-btn').onclick=function(){ showGate(''); };

/* ===== 主题 ===== */
(function(){
  var t=localStorage.getItem('mimo.panel.theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  document.documentElement.setAttribute('data-theme',t);
})();
document.getElementById('theme-btn').onclick=function(){
  var next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('mimo.panel.theme',next);
};

/* ===== 数据 ===== */
var state={status:null,files:[],usage:[],days:[]};
function mimoFiles(){ return state.files.filter(function(f){ return (f.provider||f.type)==='mimo'; }); }
function authIndex(f){ return f.auth_index||''; }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
async function loadAll(){
  state.status=await api('/v0/management/plugins/mimo/status');
  var j=await api('/v0/management/auth-files');
  state.files=j.files||j||[];
  var h=await api('/v0/management/plugins/mimo/usage/history?_='+Date.now());
  state.usage=h.points||[];
  var d=await api('/v0/management/plugins/mimo/usage/daily?days=30');
  state.days=d.days||[];
}

/* ===== 总览 KPI ===== */
function renderKpi(){
  var files=mimoFiles();
  var enabled=files.filter(function(f){ return !f.disabled&&f.status==='active'; });
  var models=(state.status&&state.status.models&&state.status.models.Count)||0;
  var pcts=files.map(function(f){
    var m=/剩余\s*(\d+(?:\.\d+)?)%/.exec(f.label||'');
    return m?parseFloat(m[1]):null;
  }).filter(function(v){ return v!==null; });
  var avg=pcts.length?Math.round(pcts.reduce(function(a,b){ return a+b; },0)/pcts.length):null;
  var today=(state.days||[]).slice(-1)[0]||{success:0,failed:0};
  var items=[
    {l:'账号总数',v:files.length},
    {l:'可用账号',v:enabled.length},
    {l:'模型数',v:models},
    {l:'平均剩余额度',v:(avg===null?'—':avg+'%')},
    {l:'今日请求',v:(today.success+today.failed)}
  ];
  document.getElementById('kpi').innerHTML=items.map(function(it){
    return '<div class="card kpi"><div class="v">'+it.v+'</div><div class="l">'+it.l+'</div></div>';
  }).join('');
}

/* ===== 图表（手写 SVG） ===== */
function lineChart(svgId,legendId,series){
  var svg=document.getElementById(svgId);
  var W=640,H=220,PL=42,PR=12,PT=12,PB=24;
  var iw=W-PL-PR,ih=H-PT-PB;
  var colors=['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444','#06b6d4'];
  var n=Math.max.apply(null,series.map(function(s){ return s.points.length; }).concat([2]));
  var x=function(i){ return PL+iw*(n<=1?0:i/(n-1)); };
  var y=function(v){ return PT+ih*(1-Math.max(0,Math.min(100,v))/100); };
  var out=[];
  for(var g=0;g<=4;g++){
    var gy=PT+ih*g/4;
    out.push('<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="currentColor" opacity=".12"/>');
    out.push('<text x="'+(PL-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="10" fill="currentColor" opacity=".5">'+(100-g*25)+'%</text>');
  }
  series.forEach(function(s,si){
    if(!s.points.length) return;
    var pts=s.points.map(function(v,i){ return x(i)+','+y(v); }).join(' ');
    out.push('<polygon points="'+x(0)+','+y(0)+' '+pts+' '+x(s.points.length-1)+','+y(0)+'" fill="'+colors[si%colors.length]+'" opacity=".10"/>');
    out.push('<polyline points="'+pts+'" fill="none" stroke="'+colors[si%colors.length]+'" stroke-width="2" stroke-linejoin="round"/>');
  });
  svg.innerHTML=out.join('');
  if(legendId){
    document.getElementById(legendId).innerHTML=series.map(function(s,si){
      return '<span class="pill" style="color:'+colors[si%colors.length]+'">● '+esc(s.name)+'</span>';
    }).join('');
  }
}
function barChart(svgId,days){
  var svg=document.getElementById(svgId);
  var W=640,H=220,PL=34,PR=10,PT=12,PB=24;
  var iw=W-PL-PR,ih=H-PT-PB;
  var max=Math.max.apply(null,days.map(function(d){ return d.success+d.failed; }).concat([1]));
  var bw=iw/Math.max(days.length,1);
  var out=[];
  for(var g=0;g<=3;g++){
    var gy=PT+ih*g/3;
    out.push('<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="currentColor" opacity=".12"/>');
    out.push('<text x="'+(PL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="10" fill="currentColor" opacity=".5">'+Math.round(max*(3-g)/3)+'</text>');
  }
  days.forEach(function(d,i){
    var hs=ih*(d.success/max),hf=ih*(d.failed/max);
    var bx=PL+i*bw+bw*0.18,w=bw*0.64;
    out.push('<rect x="'+bx+'" y="'+(PT+ih-hs)+'" width="'+w+'" height="'+hs+'" fill="#10b981" rx="2"><title>'+d.date+' 成功 '+d.success+'</title></rect>');
    out.push('<rect x="'+bx+'" y="'+(PT+ih-hs-hf)+'" width="'+w+'" height="'+hf+'" fill="#ef4444" rx="2"><title>'+d.date+' 失败 '+d.failed+'</title></rect>');
    if(i%5===0) out.push('<text x="'+(bx+w/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="currentColor" opacity=".5">'+d.date.slice(5)+'</text>');
  });
  svg.innerHTML=out.join('');
}
function renderCharts(){
  var byAuth={};
  state.usage.forEach(function(p){
    if(!byAuth[p.auth_id]) byAuth[p.auth_id]=[];
    byAuth[p.auth_id].push(p.percent);
  });
  var series=Object.keys(byAuth).map(function(k){ return {name:k,points:byAuth[k].slice(-96)}; });
  if(!series.length) series=[{name:'暂无采样（刷新额度后累积）',points:[]}];
  lineChart('chart-line','line-legend',series);
  barChart('chart-bar',state.days||[]);
}

/* ===== 账号卡（管理 + 额度一体） ===== */
function ringSvg(pct){
  var r=38,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(100,pct))/100);
  return '<svg class="ring" viewBox="0 0 96 96">'+
    '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="currentColor" opacity=".12" stroke-width="9"/>'+
    '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" opacity=".85"'+
    ' stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 48 48)"/>'+
    '<text x="48" y="54" text-anchor="middle" font-size="17" font-weight="650" fill="currentColor">'+Math.round(pct)+'%</text></svg>';
}
function renderAccounts(){
  var box=document.getElementById('accounts');
  var files=mimoFiles();
  if(!files.length){
    box.innerHTML='<div class="card muted">暂无 mimo 凭证 —— 点「在线登录小米账号」添加。</div>';
    return;
  }
  box.innerHTML=files.map(function(f,i){
    var m=/剩余\s*(\d+(?:\.\d+)?)%/.exec(f.label||'');
    var pct=m?parseFloat(m[1]):null;
    var rst=/(\d{4}-\d{2}-\d{2})\s*重置/.exec(f.label||'');
    var ok=f.status==='active'&&!f.disabled;
    return '<div class="card">'+
      '<div class="row between"><b>'+esc(f.label||f.name||f.id)+'</b>'+
      '<span class="pill '+(ok?'ok':(f.disabled?'warn':'bad'))+'">'+(ok?'正常':(f.disabled?'已禁用':(f.status||'异常')))+'</span></div>'+
      '<div class="row" style="gap:14px;margin-top:10px">'+
        (pct===null?'<div class="ring muted" style="display:flex;align-items:center;justify-content:center">未取</div>':ringSvg(pct))+
        '<div class="muted">'+esc(f.name)+'<br>'+(rst?'重置 '+rst[1]:'重置日期未知')+' · '+(f.size||0)+' B</div>'+
      '</div>'+
      '<div class="row" style="margin-top:12px">'+
        '<button class="btn btn-primary btn-sm" data-act="quota" data-i="'+i+'">↻ 刷新额度</button>'+
        '<button class="btn btn-sm" data-act="oauth" data-i="'+i+'">↻ 刷新 OAuth</button>'+
        '<button class="btn btn-sm" data-act="toggle" data-i="'+i+'">'+(f.disabled?'启用':'禁用')+'</button>'+
        '<button class="btn btn-sm" data-act="models" data-i="'+i+'">模型</button>'+
        '<button class="btn btn-danger btn-sm" data-act="del" data-i="'+i+'">删除</button>'+
      '</div></div>';
  }).join('');
  box.onclick=accountAction;
}
async function accountAction(ev){
  var b=ev.target.closest('button[data-act]');
  if(!b) return;
  var f=mimoFiles()[+b.dataset.i];
  if(!f) return;
  b.disabled=true;
  try{
    if(b.dataset.act==='quota'){
      await api('/v0/management/plugins/mimo/quota?auth_index='+encodeURIComponent(authIndex(f)));
      toast('额度已刷新：'+esc(f.name));
    }else if(b.dataset.act==='oauth'){
      await api('/v0/management/auth-files/refresh',{method:'POST',body:JSON.stringify({name:f.name,auth_index:authIndex(f)})});
      toast('已提交刷新 OAuth 请求');
    }else if(b.dataset.act==='toggle'){
      await api('/v0/management/auth-files/status',{method:'PATCH',body:JSON.stringify({name:f.name,disabled:!f.disabled})});
      toast(f.disabled?'已启用':'已禁用');
    }else if(b.dataset.act==='del'){
      if(!confirm('确定删除 '+f.name+'？')) return;
      await api('/v0/management/auth-files',{method:'DELETE',body:JSON.stringify({names:[f.name]})});
      toast('已删除 '+f.name);
    }else if(b.dataset.act==='models'){
      var m=await api('/v0/management/auth-files/models?name='+encodeURIComponent(f.name));
      toast('模型数：'+((m.models||m||[]).length));
    }
  }catch(e){
    if(e.message!=='auth') toast('操作失败：'+e.message);
  }
  await loadAll().catch(function(){});
  renderKpi(); renderCharts(); renderAccounts(); renderModels();
}
document.getElementById('quota-refresh-all').onclick=async function(){
  var files=mimoFiles();
  for(var i=0;i<files.length;i++){
    try{ await api('/v0/management/plugins/mimo/quota?auth_index='+encodeURIComponent(authIndex(files[i]))); }catch(e){}
  }
  toast('已全部刷新');
  await loadAll().catch(function(){});
  renderKpi(); renderCharts(); renderAccounts();
};

/* ===== 在线登录 ===== */
document.getElementById('login-new').onclick=async function(){
  var box=document.getElementById('login-box');
  box.classList.remove('hidden');
  try{
    var r=await api('/v0/management/plugins/mimo/login/start',{method:'POST',body:'{}'});
    var s=r.result||r;
    var url=s.url||s.login_url||'';
    if(!url){ document.getElementById('login-status').textContent='创建会话失败：'+JSON.stringify(s).slice(0,100); return; }
    var frame=document.getElementById('login-frame');
    frame.src=url;
    frame.classList.remove('hidden');
    document.getElementById('login-status').textContent='会话 '+(s.session||'')+' —— 扫码或账号密码登录，完成后凭证自动入库';
  }catch(e){
    if(e.message!=='auth') document.getElementById('login-status').textContent='创建登录会话失败：'+e.message;
  }
};

/* ===== 模型 ===== */
function renderModels(){
  var ms=(state.status&&state.status.models)||{};
  var list=(state.status&&state.status.model_list)||[];
  document.getElementById('models-src').textContent=
    '来源 '+(ms.Source||'—')+(ms.Err?'（'+ms.Err+'）':'')+' · '+(ms.Count||0)+' 个';
  var rows=list.map(function(m){
    return '<tr><td>'+esc(m.ID||m.Name||'')+'</td><td>'+esc(m.Type||'')+'</td><td>'+esc(m.OwnedBy||'')+'</td></tr>';
  });
  document.getElementById('models-body').innerHTML=
    rows.length?rows.join(''):'<tr><td colspan="3" class="muted">明细见 /plugins/mimo/status（此处显示数量与来源）</td></tr>';
}

/* ===== 启动 ===== */
async function boot(){
  try{
    await loadAll();
    document.getElementById('key-pill').textContent='密钥已就绪';
    renderKpi(); renderCharts(); renderAccounts(); renderModels();
  }catch(e){
    if(e.message!=='auth'){ toast('加载失败：'+e.message); document.getElementById('key-pill').textContent='加载失败'; }
  }
}
document.getElementById('refresh-all').onclick=boot;
if(!KEY) showGate(''); else boot();
</script>
</body>
</html>
