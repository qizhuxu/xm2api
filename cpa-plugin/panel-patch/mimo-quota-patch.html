<!--
  MiMo quota patch for CLIProxyAPI Management Center (v7.3.9 官方面板) — v7.4
  ------------------------------------------------------------------
  v7.4（找回 v7 的秒恢复）：
  R7 对比 v7 为什么变卡：v7 有 lastHtml 快照，React 丢卡后立即恢复显示；
     v7.1~v7.3 的 removeCards 连 html 快照一起清空，且 React 路由过渡期
     grid 瞬时不存在时误清卡（实测切回 #/quota 后 grid 晚 2s+ 出现）⇒
     数据反复被丢、只能等完整加载链。
     修复：removeCards 只卸 DOM 保留快照（v7 语义），grid 过渡期跳过挂载
     但保数据，彻底清空仅在 purgeAll（登出/插件禁用）。
  R8 observer 风暴（v7.3 实测 evaluate 排队 57s 的根因）：
     paintFromCache 在 observer 每次巡检里重算渲染，而 renderBody 的
     「X 分钟后刷新」每次都变 ⇒ innerHTML 幂等比较永远不等 ⇒ 写 DOM →
     observer → 重算无限循环，主线程堵死。
     修复：巡检只恢复快照不重算；重算仅在数据刷新完成时。
     实测点击导航 首访 259ms / 切回 184ms 出数据卡。
  R9 残余风暴（用户实测「还是可能卡死」）：paintFromCache 在 key 空窗/
     失败分支仍会被高频调用，重算→时间文本变→写 DOM→observer 循环。
     修复：数据版本守卫（lastPaintTs===dataCache.ts 且快照在 ⇒ 绝不重算）
     ——「渲染进快照」与「挂载到 DOM（placeCards）」彻底分层。
     压力实测（stale+key 空窗+持续 observer）主线程响应 1~2ms。
  v7.3（即时显示，SWR）：
  R6 quota 页总有占位→数据的跳变（不像 #/auth-files 原生即时）
     根因：拉数据与画卡耦合，进页面必须等调度+API 往返。
     修复：数据层 SWR 化 —— IIFE 执行即预取（早于 React 渲染 grid）、
     sessionStorage 缓存跨刷新存活、进页面先画缓存 0 等待、60s 内
     不重复拉取、各账号 quota 并行拉取、hashchange 去 300ms 延迟。
  v7.2（占位卡与加载速度）：
  R4 占位卡泄漏内部名 __boot__、其刷新按钮拿占位名匹配凭证
     修复：特殊名（_ 开头）标题显示「MiMo (Xiaomi) 剩余使用量」，
     按钮转整轮刷新；占位内容改 loading 文案。
  R5 密钥未到时只能等 60s 定时（2s 轮询只归位不拉数据）
     修复：key 空时 2.5s 自动重试渲染，key 一到手立即出数据。
  v7.1（实测 DOM 后的三处回归修复）：
  R1 #/auth-files 刷新报「未匹配到凭证」
     实测 DOM：mimo 卡没有 fileName 元素、文本无 .json/(userId)，
     只有 account 元素（去扩展名 mimo-1000000001）⇒ fileNameOf 三级全空。
     修复：优先取 account/fileName 元素原文，pickEntry 归一化后对
     name/id/去扩展名三字段匹配。
  R2 #/quota mimo 卡消失
     根因：a) tabFilteredOut 把 tab='mimo' 当筛除（o.tab!=='all' 一刀切），
     点 mimo 筛选反而全删；b) v7.0 数据驱动建卡，key/数据未到时首渲染全空。
     修复：tab 名含 mimo 一律渲染；renderPass 先建 __boot__ 占位卡。
  R3（v7.0 遗留说明见下）

  v7（多账号正确性）：
  Q1 #/quota 多账号挤在一张卡
     根因：doRefresh 把所有凭证的额度循环拼进单例 mq-card。
     修复：每账号一张 mq-card（data-mq-name 标识），各自拉取/缓存/绑定
     刷新按钮，React 重渲染后按 name 归位恢复，互不串数据。
  Q2 #/auth-files 各卡显示的余量相同
     根因：doInline 找不到 DOM 文件名时 fallback files[0] ⇒ 所有卡片
     显示同一账号的余量。
     修复：fileNameOf 增强（class → 文本 .json → label 里的 userId 反推），
     pickEntry 按 name 精确匹配（同名双条目取带用量 label 的），匹配不上
     如实报错，绝不 fallback 别人的数据。
  Q3 宿主双条目（save 注册条目 + watcher 扫描条目同名并存）
     修复：mimoAuthFiles 按 name 归并去重，保留带用量 label 的条目。

  v6（研究面板 bundle static/management.html 后修复用户实测的 4 个问题）：

  P1 插件禁用后卡片残留
     根因：v5 从不查询插件状态。
     修复：pluginEnabled() 调 GET /v0/management/plugins（bundle/后端实测
     返回 plugins[].effective_enabled / registered 字段），id==='mimo' 且
     effective_enabled!==true 或 registered===false ⇒ purgeAll() 清除
     #/quota 网格卡与 #/auth-files 额度区；30s 缓存；查询失败 fail-open
     用上次值（API 瞬断 ≠ 插件禁用）。

  P2 #/quota 卡片每隔一段时间闪烁
     根因（v5 源码）：a) MutationObserver 回调条件含
     `card && document.body.contains(card)` —— React 重渲染把外来节点
     （卡片）从 grid 丢弃后该条件为 false，observer 拒绝重建，只能等
     2s 兜底轮询 ⇒ 0~2 秒可见空窗；b) 60s 定时 doRefresh 先把 innerHTML
     换成「正在加载额度...」⇒ 内容闪烁。
     修复：a) observer/轮询改为无条件幂等 placeCard()（内部校验父节点，
     React 移除后同 tick 从 lastHtml 恢复）；b) 自动刷新 silent 模式：
     不写 loading，数据不变不动 DOM，仅用户点击才显示加载反馈。

  P3 登录界面显示 mimo 额度卡片
     根因：placeCard() 在 QuotaPage grid 不存在时 fallback 到
     document.body/main 并插到首位 —— 登录页 hash 仍可是 #/quota。
     修复：删除 fallback —— grid 不存在一律不渲染；另检测面板登录页
     DOM（LoginPage-module__*，bundle 实测 class：loginCard___OgP-R），
     命中即 purgeAll()。grid 存在 = 已登录且身处 QuotaPage，唯一合法挂点。

  P4 #/auth-files 卡片无进度条、刷新按钮不透明
     根因（bundle CSS/JSX 实锤）：官方透明按钮选择器是
     `button.AuthFileQuota-module__quotaMessageAction___B2326`
     {background:0 0;border:0}，且 idle 按钮官方结构为
     class="quotaMessage quotaMessageAction" 双 class（见 bundle
     AuthFileQuota 组件 JSX：h==='idle' ⇒ button 双 class）。
     v5 的 panelQuotaClasses() 在 antigravity 卡不在场/未渲染时 fallback
     成空 class ⇒ 原生 button，且 quotaSection 是 flex column，
     align-items:stretch 把无样式 button 拉成通栏灰底黑框 = 用户截图。
     修复：a) 内置从 bundle 提取的 AuthFileQuota-module__* 完整 class map
     （hash 后缀含连字符的真实值），live DOM 存在时优先覆盖（面板升级自愈）；
     b) idle/loading/error/数据态全部按官方语汇渲染；c) 数据态复刻官方
     antigravity Body（VO 组件）+ 进度条（SO 组件）结构与阈值：
        div.antigravityQuotaGroup > div.antigravityQuotaGroupHeader
          > span.antigravityQuotaGroupTitle(分组名)
        + div.quotaRow > div.quotaRowHeader
            > span.quotaModel(bucket.label|window)
            + div.quotaMeta > span.quotaPercent(「剩余 X%」/「额度可用」)
                            + span.quotaReset[+quotaResetRelativeSoon]
                              (「X 天 Y 小时 后刷新」/「可刷新」，≤24h 为 soon)
          + div.quotaBar > div.quotaBarFill + High|Medium|Low
            （SO 组件阈值：>=70 High(success)、>=30 Medium、<30 Low(failure)；
             style.width=percent%、--meter-index=序号）
     i18n 文案与 bundle zh 资源逐字对齐（bundle @antigravity_quota）：
       idle=点击此处刷新额度 loading=正在加载额度... plan_label=套餐
       remaining_percent=剩余 {{percent}}% quota_available=额度可用
       refreshes_in={{duration}} 后刷新 refresh_button=刷新额度
       duration_day_hour={{days}} 天 {{hours}} 小时 等
     React 重建 auth 卡片后由 inlineCache 恢复已加载内容（同 P2 思路）。

  数据源：GET /v0/management/plugins/mimo/quota?auth_index=<idx>
  （插件 quota_provider 标准端点，normalized {subscription/summary/groups}），
  失败回退 POST /v0/management/quota/fetch。
  密钥仍零配置：fetch/XHR hook 捕获面板会话 Authorization（先于 bundle 执行）。

  上游展望：官方面板若为 supports_quota=true 的插件条目做通用 adapter，
  本补丁即可退场。

  应用方法（Linux/Windows 通用）：
    1. config.yaml：remote-management.disable-auto-update-panel: true
    2. 从干净官方 management.html 重新注入本补丁（勿在旧补丁上叠加）：
         cp management.html.orig management.html   # 或重新下载官方面板
         python3 - <<'EOF'
         import re
         p='static/management.html'; patch=open('mimo-quota-patch.html',encoding='utf-8').read()
         html=open(p,encoding='utf-8').read()
         assert patch.strip() not in html
         html,n=re.subn(r'(<head[^>]*>)',lambda m:m.group(1)+'\n'+patch,html,count=1)
         assert n==1
         open(p,'w',encoding='utf-8').write(html)
         EOF
    3. 硬刷新面板页面（Ctrl+F5；静态文件，无需重启 CPA）。
-->
<style>
.mq-card{padding:14px 16px;border:1px solid rgba(128,128,128,.35);border-radius:10px;
  font:13px/1.6 system-ui,-apple-system,sans-serif;background:rgba(128,128,128,.06);margin:0 0 12px}
.mq-card h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mq-tips{color:#888;font-size:12px}
.mq-warn{color:#b26a00}
.mq-card .mq-meta{color:#666;font-size:12px;margin:2px 0 6px}
</style>
<script>
/* MiMo quota patch v7.4 — 见文件头注释。密钥只驻留内存变量，不落盘、不外发。 */
(function(){
  if(window.__mimoQuotaPatch) return; window.__mimoQuotaPatch=7.4;

  /* ================= 1. 会话密钥自动捕获（先于面板 bundle 执行） ================= */
  var KEY_EVT='mimo-key-captured';
  function capture(v){
    if(!v) return;
    var key=String(v).replace(/^Bearer\s+/i,'').trim();
    if(!key) return;
    var isNew=!window.__mimoMgmtKey, changed=window.__mimoMgmtKey!==key;
    window.__mimoMgmtKey=key;
    /* 值变化也触发：面板启动时会把 localStorage 的明文 managementKey 加密迁移
       （El.migratePlaintextKeys），早先 fallback 捕获的密文要能被 hook 拿到的明文
       覆盖并唤醒自动加载链（KEY_EVT）。同值不重复触发，无事件风暴。 */
    if(isNew||changed){ try{ window.dispatchEvent(new Event(KEY_EVT)); }catch(e){} }
  }
  try{
    var of=window.fetch;
    if(of){
      window.fetch=function(){
        try{
          var h=(arguments[1]&&arguments[1].headers)||null;
          if(h){
            var auth=null;
            if(typeof h.get==='function') auth=h.get('Authorization');
            else if(Object.prototype.hasOwnProperty.call(h,'Authorization')) auth=h.Authorization;
            else if(Object.prototype.hasOwnProperty.call(h,'authorization')) auth=h.authorization;
            if(auth) capture(auth);
          }
        }catch(e){}
        return of.apply(this,arguments);
      };
    }
  }catch(e){}
  try{
    var oxh=XMLHttpRequest.prototype.open, osr=XMLHttpRequest.prototype.setRequestHeader;
    XMLHttpRequest.prototype.open=function(){ return oxh.apply(this,arguments); };
    XMLHttpRequest.prototype.setRequestHeader=function(k,v){
      try{ if(k && String(k).toLowerCase()==='authorization') capture(v); }catch(e){}
      return osr.apply(this,arguments);
    };
  }catch(e){}

  /* ================= 2. 基础工具 ================= */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function isQuotaRoute(){ return /quota/i.test(location.hash||''); }
  function isAuthRoute(){ return /auth/i.test(location.hash||''); }
  function loggedOut(){ return !!document.querySelector('[class*="LoginPage-module__"]'); }
  function tabFilteredOut(){
    try{
      var s=sessionStorage.getItem('quotaPage.uiState');
      if(!s) return false;
      var o=JSON.parse(s);
      /* tab=all 或 tab 名含 mimo 都要渲染（实测：用户点 mimo 筛选 tab 时
         o.tab='mimo'，旧逻辑 o.tab!=='all' 一刀切会把 mimo 卡全删）。 */
      return !!(o && typeof o.tab==='string' && o.tab && o.tab!=='all' && !/mimo/i.test(o.tab));
    }catch(e){ return false; }
  }
  function findKey(){
    if(window.__mimoMgmtKey) return window.__mimoMgmtKey;
    try{
      var v=localStorage.getItem('managementKey');
      /* 面板 bundle 会把明文 key 加密迁移（实测 12 字符明文 → 29 字符密文），
         fallback 只信形如明文的值（mgmt-* 前缀启发式 + 长度上限），
         密文不塞进 __mimoMgmtKey；hook 捕获的明文永远优先（上方分支）。 */
      if(v && v.trim() && v.charAt(0)==='m' && v.length<=64){ capture(v); return window.__mimoMgmtKey||''; }
    }catch(e){}
    return '';
  }
  async function fetchQuotaFor(key,authIndex){
    try{
      var r=await fetch('/v0/management/plugins/mimo/quota?auth_index='+encodeURIComponent(authIndex),
        {headers:{'Authorization':'Bearer '+key,'X-Management-Key':key}});
      var t=await r.text(); var j=null; try{ j=JSON.parse(t); }catch(e){}
      if(r.ok && j && !j.error) return j;
    }catch(e){}
    try{
      var r2=await fetch('/v0/management/quota/fetch',{method:'POST',
        headers:{'Authorization':'Bearer '+key,'X-Management-Key':key,'content-type':'application/json'},
        body:JSON.stringify({auth_index:authIndex})});
      var t2=await r2.text(); var j2=null; try{ j2=JSON.parse(t2); }catch(e){}
      if(!j2) return {__error:'HTTP '+r2.status};
      var q=j2.result||j2;
      return q&&q.error?{__error:q.error}:q;
    }catch(e){ return {__error:String(e)}; }
  }
  async function mimoAuthFiles(key){
    var af=await fetch('/v0/management/auth-files',{headers:{'Authorization':'Bearer '+key,'X-Management-Key':key}});
    var txt=await af.text(); var aj=null; try{ aj=JSON.parse(txt); }catch(e){}
    if(!aj) throw new Error('auth-files HTTP '+af.status);
    var arr=(aj.files||aj||[]).filter(function(f){ return (f.provider==='mimo'||f.type==='mimo') && !f.runtime_only; });
    /* 去重：宿主会同时返回「host.auth.save 注册条目（id=去扩展名，带用量 label）」
       与「watcher 文件扫描条目（id=完整文件名，label='mimo'）」——同一文件两条。
       按 name 归并，同名优先保留带用量 label 的那条，保证一文件一条、数据不串。 */
    var seen={}, out=[];
    for(var i=0;i<arr.length;i++){
      var n=arr[i].name||arr[i].auth_index||String(i);
      if(seen[n]!==undefined){
        var cur=out[seen[n]];
        if(/\d%/.test(arr[i].label||'') && !/\d%/.test(cur.label||'')) out[seen[n]]=arr[i];
        continue;
      }
      seen[n]=out.length; out.push(arr[i]);
    }
    return out;
  }

  /* ================= 3. 插件启用状态（P1） ================= */
  var enCache={v:null,ts:0};
  async function pluginEnabled(key){
    var now=Date.now();
    if(enCache.v!==null && now-enCache.ts<30000) return enCache.v;
    try{
      var r=await fetch('/v0/management/plugins',{headers:{'Authorization':'Bearer '+key,'X-Management-Key':key}});
      var t=await r.text(); var j=null; try{ j=JSON.parse(t); }catch(e){}
      /* 查询失败（401 用了密文 key、非 JSON、结构不符）≠ 插件禁用：
         fail-open 沿用上次值/true，绝不缓存 false —— 否则一次坏查询会
         让卡片被 purge 拦截 30 秒（v6 实测 bug）。 */
      if(!r.ok || !j || !Array.isArray(j.plugins)){
        return enCache.v===null?true:enCache.v;
      }
      var arr=j.plugins, hit=null;
      for(var i=0;i<arr.length;i++){ if(arr[i].id==='mimo'){ hit=arr[i]; break; } }
      if(!hit){ enCache={v:false,ts:now}; return false; }   /* 成功响应但插件未注册 */
      var ok=hit.effective_enabled===true && hit.registered!==false;
      enCache={v:ok,ts:now};
      return ok;
    }catch(e){ return enCache.v===null?true:enCache.v; }
  }
  function invalidateEnabled(){ enCache={v:null,ts:0}; }

  /* ================= 4. 官方 class map 与文案（bundle 实测提取） ================= */
  /* hash 后缀取自 static/management.html（AuthFileQuota CSS/JSX）；
     面板升级后若 hash 变化，authCls() 会优先用 live DOM 里的真实值覆盖。 */
  var AUTH_C={
    quotaSection:'AuthFileQuota-module__quotaSection___B1NkU',
    quotaMessage:'AuthFileQuota-module__quotaMessage___cvzkK',
    quotaMessageAction:'AuthFileQuota-module__quotaMessageAction___B2326',
    quotaError:'AuthFileQuota-module__quotaError___j6Dml',
    quotaCardActions:'AuthFileQuota-module__quotaCardActions___Wy2PY',
    quotaRow:'AuthFileQuota-module__quotaRow___ufmMU',
    quotaRowHeader:'AuthFileQuota-module__quotaRowHeader___V-41W',
    quotaModel:'AuthFileQuota-module__quotaModel___C-dFE',
    quotaMeta:'AuthFileQuota-module__quotaMeta___uftxo',
    quotaPercent:'AuthFileQuota-module__quotaPercent___WY2j6',
    quotaReset:'AuthFileQuota-module__quotaReset___qSOIY',
    quotaResetRelativeSoon:'AuthFileQuota-module__quotaResetRelativeSoon___j58iD',
    quotaBar:'AuthFileQuota-module__quotaBar___5C9oU',
    quotaBarFill:'AuthFileQuota-module__quotaBarFill___vBml3',
    quotaBarFillHigh:'AuthFileQuota-module__quotaBarFillHigh___Z22Yp',
    quotaBarFillMedium:'AuthFileQuota-module__quotaBarFillMedium___FwcLR',
    quotaBarFillLow:'AuthFileQuota-module__quotaBarFillLow___ose2c',
    antigravityQuotaGroup:'AuthFileQuota-module__antigravityQuotaGroup___cGr3L',
    antigravityQuotaGroupHeader:'AuthFileQuota-module__antigravityQuotaGroupHeader___I5iUs',
    antigravityQuotaGroupTitle:'AuthFileQuota-module__antigravityQuotaGroupTitle___IcwtE',
    antigravityQuotaGroupDescription:'AuthFileQuota-module__antigravityQuotaGroupDescription___QIQvW',
    codexPlan:'AuthFileQuota-module__codexPlan___qVz5l',
    codexPlanItem:'AuthFileQuota-module__codexPlanItem___VZnNr',
    codexPlanLabel:'AuthFileQuota-module__codexPlanLabel___K-Sbq',
    codexPlanValue:'AuthFileQuota-module__codexPlanValue___6W2YL'
  };
  function authCls(){
    var c={}; for(var k in AUTH_C) c[k]=AUTH_C[k];
    var mm;
    var s=document.querySelector('[class*="AuthFileQuota-module__quotaSection"]');
    if(s){
      if(mm=s.className.match(/AuthFileQuota-module__quotaSection___[\w-]+/)) c.quotaSection=mm[0];
      var b=s.querySelector('[class*="quotaMessage"]');
      if(b){
        if(mm=b.className.match(/AuthFileQuota-module__quotaMessage___[\w-]+/)) c.quotaMessage=mm[0];
        if(mm=b.className.match(/AuthFileQuota-module__quotaMessageAction___[\w-]+/)) c.quotaMessageAction=mm[0];
      }
    }
    return c;
  }
  /* i18n：与 bundle zh 资源 antigravity_quota.* 逐字一致 */
  var T={idle:'点击此处刷新额度',loading:'正在加载额度...',loadFailed:'额度获取失败：',
    empty:'暂无额度数据',planLabel:'套餐',available:'额度可用',
    refreshBtn:'刷新额度',refreshAvailable:'可刷新'};

  function fmtDur(ms){
    var m=Math.max(1,Math.round(ms/60000));
    var d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mi=m%60;
    if(d>0) return d+' 天 '+h+' 小时';       /* duration_day_hour */
    if(h>0) return h+' 小时 '+mi+' 分钟';     /* duration_hour_minute */
    return mi+' 分钟';                        /* duration_minute */
  }
  function fmtReset(rt){
    if(!rt) return {txt:'',soon:false};
    var t=new Date(rt).getTime()-Date.now();
    if(!isFinite(t)) return {txt:'',soon:false};
    if(t<=0) return {txt:T.refreshAvailable,soon:true};
    return {txt:fmtDur(t)+' 后刷新',soon:t<=24*3600*1000}; /* refreshes_in */
  }
  function quotaBits(q){
    var out={pct:null,plan:''};
    out.plan=(q&&q.subscription&&q.subscription.plan)||'';
    (q&&q.groups||[]).forEach(function(g){
      (g.buckets||[]).forEach(function(b){
        if(out.pct===null && typeof b.remainingFraction==='number') out.pct=b.remainingFraction*100;
      });
    });
    if(out.pct===null && q&&q.summary){
      (q.summary||[]).forEach(function(s){ if(out.pct===null && typeof s.value==='number') out.pct=s.value; });
    }
    return out;
  }

  /* ================= 5. 官方 Body 结构复刻（VO + SO，bundle JSX 实测） ================= */
  function barHtml(pct,idx,C){
    var r=(pct===null)?null:Math.max(0,Math.min(100,pct));
    var fill=(r===null)?C.quotaBarFillMedium:(r>=70?C.quotaBarFillHigh:(r>=30?C.quotaBarFillMedium:C.quotaBarFillLow));
    var w=(r===null)?0:(Math.round(r*100)/100);
    return '<div class="'+C.quotaBar+'"><div class="'+C.quotaBarFill+' '+fill+
      '" style="width:'+w+'%;--meter-index:'+idx+'"></div></div>';
  }
  function renderBody(q,titlePrefix){
    var C=authCls(), b=quotaBits(q), h='', idx=0;
    if(b.plan){
      h+='<div class="'+C.codexPlan+'"><span class="'+C.codexPlanItem+'">'+
        '<span class="'+C.codexPlanLabel+'">'+T.planLabel+'</span>'+
        '<span class="'+C.codexPlanValue+'">'+esc(b.plan)+'</span></span></div>';
    }
    var groups=(q&&q.groups)||[];
    if(!groups.length){
      if(b.pct===null) return h+'<div class="'+C.quotaMessage+'">'+T.empty+'</div>';
      /* summary-only 回退：单行渲染 */
      var pctTxt=(b.pct>=99.95)?T.available:('剩余 '+Math.round(b.pct)+'%');
      h+='<div class="'+C.antigravityQuotaGroup+'"><div class="'+C.antigravityQuotaGroupHeader+'">'+
        '<span class="'+C.antigravityQuotaGroupTitle+'">'+esc(titlePrefix||'')+'</span></div>'+
        '<div class="'+C.quotaRow+'"><div class="'+C.quotaRowHeader+'">'+
        '<span class="'+C.quotaModel+'">—</span>'+
        '<div class="'+C.quotaMeta+'"><span class="'+C.quotaPercent+'">'+esc(pctTxt)+'</span></div>'+
        '</div>'+barHtml(b.pct,idx++,C)+'</div></div>';
      return h;
    }
    groups.forEach(function(g){
      var title=g.displayName||g.label||'';
      if(titlePrefix) title=(titlePrefix?(titlePrefix+(title?(' · '+title):'')):title);
      h+='<div class="'+C.antigravityQuotaGroup+'"><div class="'+C.antigravityQuotaGroupHeader+'">'+
        '<span class="'+C.antigravityQuotaGroupTitle+'">'+esc(title)+'</span>'+
        (g.description?('<span class="'+C.antigravityQuotaGroupDescription+'">'+esc(g.description)+'</span>'):'')+
        '</div>';
      (g.buckets||[]).forEach(function(bk){
        var pct=(typeof bk.remainingFraction==='number')?Math.max(0,Math.min(1,bk.remainingFraction))*100:null;
        var pctTxt=(pct===null)?'':((pct>=99.95)?T.available:('剩余 '+Math.round(pct)+'%'));
        var rst=fmtReset(bk.resetTime);
        h+='<div class="'+C.quotaRow+'"><div class="'+C.quotaRowHeader+'">'+
          '<span class="'+C.quotaModel+'" title="'+esc(bk.description||'')+'">'+esc(bk.label||bk.window||'—')+'</span>'+
          '<div class="'+C.quotaMeta+'">'+
          (pctTxt?('<span class="'+C.quotaPercent+'">'+esc(pctTxt)+'</span>'):'')+
          (rst.txt?('<span class="'+C.quotaReset+(rst.soon?(' '+C.quotaResetRelativeSoon):'')+'">'+esc(rst.txt)+'</span>'):'')+
          '</div></div>'+barHtml(pct,idx++,C)+'</div>';
      });
      h+='</div>';
    });
    return h;
  }
  function idleHtml(){ var C=authCls(); return '<button type="button" class="'+C.quotaMessage+' '+C.quotaMessageAction+'" data-mq-refresh>'+T.idle+'</button>'; }
  function loadingHtml(){ var C=authCls(); return '<div class="'+C.quotaMessage+'">'+T.loading+'</div>'; }
  function errorHtml(msg){ var C=authCls(); return '<div class="'+C.quotaError+'">'+T.loadFailed+esc(msg)+'</div>'; }
  function actionsHtml(){ var C=authCls(); return '<div class="'+C.quotaCardActions+'"><button type="button" class="'+C.quotaMessage+' '+C.quotaMessageAction+'" data-mq-refresh>'+T.refreshBtn+'</button></div>'; }

  /* ================= 6. #/quota 网格卡片（每账号一卡） ================= */
  /* v7：不再单卡拼所有账号 —— 每个 mimo 凭证一张 mq-card（data-mq-name 标识），
     React 重渲染后按 name 归位/恢复，互不串数据。 */
  var cards={}; /* name -> {el, html} */
  function hostGrid(){ return document.querySelector('[class*="QuotaPage-module__grid"]'); }
  /* 只卸 DOM、保留 html 快照（v7 lastHtml 秒恢复语义）—— React 重渲染/路由
     切回时立即恢复显示，不重新走加载链。彻底清空交给 purgeAll。 */
  function removeCards(){ for(var k in cards){ var c=cards[k]; if(c.el&&c.el.parentNode) c.el.parentNode.removeChild(c.el); c.el=null; } }
  function wipeCards(){ removeCards(); cards={}; }
  function removeCardFor(name){ var c=cards[name]; if(c&&c.el&&c.el.parentNode) c.el.parentNode.removeChild(c.el); delete cards[name]; }  function bindCard(el,name){
    var bs=el.querySelectorAll('[data-mq-refresh]');
    for(var i=0;i<bs.length;i++){
      bs[i].onclick=function(ev){
        if(ev&&ev.preventDefault) ev.preventDefault();
        /* __boot__/__none__/__err__ 是占位卡：整轮刷新，别拿占位名去匹配凭证 */
        if(name && name.charAt(0)==='_') doRefreshAll(false);
        else doRefreshOne(name,false);
      };
    }
  }
  function cardTitle(name){
    return (name && name.charAt(0)==='_') ? 'MiMo (Xiaomi) 剩余使用量' : esc(name||'MiMo (Xiaomi) 剩余使用量');
  }
  function cardHeader(f){
    var lbl=Array.isArray(f.label)?f.label.join(' | '):(f.label||'');
    return '<h3>'+esc(f.name||'mimo')+'</h3>'+(lbl?('<div class="mq-meta">'+esc(lbl)+'</div>'):'');
  }
  function cardIdleHtml(name){
    return '<h3>'+cardTitle(name)+'</h3><div>'+loadingHtml()+'</div>'+
      '<div class="mq-tips" style="margin-top:6px">数据源：'+
      'GET /v0/management/plugins/mimo/quota（插件 quota_provider 标准端点）。</div>';
  }
  /* P3：grid 不存在 / 登录页 ⇒ 不渲染；grid 瞬时不存在（React 路由过渡）只跳过
     挂载、保留数据 —— 实测切回 #/quota 后 grid 可晚 2s+ 出现，此处清卡会导致
     数据反复被丢、只能等完整加载链（v7.1~v7.3 的「卡一会」根因之一）。 */
  function placeCards(){
    var g=hostGrid();
    if(loggedOut()){ removeCards(); return; }
    if(!g) return;
    for(var name in cards){
      var c=cards[name];
      if(c.el && c.el.parentNode && document.body.contains(c.el)){
        if(c.el.parentNode!==g) g.appendChild(c.el);
      } else {
        c.el=document.createElement('div'); c.el.className='mq-card'; c.el.setAttribute('data-mq-name',name);
        g.appendChild(c.el);
        c.el.innerHTML=c.html||cardIdleHtml(name); bindCard(c.el,name);
      }
    }
  }
  function cardFor(name){
    if(!cards[name]) cards[name]={el:null,html:''};
    return cards[name];
  }
  function paintCard(c,name,head,body){
    var h=head+body+actionsHtml();
    c.html=h;
    if(c.el && document.body.contains(c.el) && c.el.innerHTML!==h){ c.el.innerHTML=h; bindCard(c.el,name); }
    return h;
  }
  /* ============== 6.5 数据层（SWR：缓存秒显 + 后台刷新 + 预取） ==============
     像 #/auth-files 一样即时的关键：拉数据与画卡解耦 —— IIFE 执行即预取，
     sessionStorage 缓存跨刷新存活；进页面先画缓存（stale-while-revalidate），
     后台刷新后静默替换。quota 数据经 JSON round-trip 无损。 */
  var CACHE_KEY='mq.quota.cache.v1';
  var dataCache=null, retryTimer=null, busy=false;
  function loadCache(){ try{ var s=sessionStorage.getItem(CACHE_KEY); if(s) dataCache=JSON.parse(s); }catch(e){} }
  function saveCache(){ try{ sessionStorage.setItem(CACHE_KEY, JSON.stringify(dataCache)); }catch(e){} }
  function cacheStale(){ return !dataCache || !dataCache.entries || !dataCache.entries.length || (Date.now()-(dataCache.ts||0))>60000; }
  /* 把数据渲染进快照（c.html）。数据版本（dataCache.ts）没变就绝不重算：
     renderBody 的相对时间每次都变，重算必写 DOM ⇒ observer 风暴；
     DOM 丢失/重挂是 placeCards 的职责（从快照恢复），与此无关。 */
  var lastPaintTs=-1;
  function paintFromCache(){
    if(!dataCache || !dataCache.entries || !dataCache.entries.length) return false;
    if(lastPaintTs===dataCache.ts && Object.keys(cards).length) return true;
    var live={};
    for(var i=0;i<dataCache.entries.length;i++){
      var e=dataCache.entries[i];
      live[e.name]=1;
      var q=e.q||{};
      paintCard(cardFor(e.name), e.name, cardHeader(e.f||{name:e.name}),
        (q.__error)?errorHtml(q.__error):renderBody(q));
    }
    for(var k in cards){ if(!live[k]) removeCardFor(k); }
    loaded=true; lastPaintTs=dataCache.ts;
    return true;
  }
  async function refreshData(silent){
    if(busy) return;
    busy=true;
    try{
      var key=findKey();
      if(!key){
        /* key 未到：有缓存先用缓存（不打扰），否则显示等待提示；2.5s 自动重试 */
        if(!paintFromCache()){
          var wh='<h3>MiMo (Xiaomi) 剩余使用量</h3><div class="mq-warn">'+
            '正在等待面板会话密钥…若长时间未自动加载，请硬刷新本页（Ctrl+F5），无需任何手动配置。</div>';
          for(var n in cards){ var c=cardFor(n); c.html=wh;
            if(c.el&&document.body.contains(c.el)&&c.el.innerHTML!==wh) c.el.innerHTML=wh; }
        }
        if(!retryTimer){ retryTimer=setTimeout(function(){ retryTimer=null; maybeRender(true); },2500); }
        return;
      }
      var en=await pluginEnabled(key);
      if(!en){ invalidateEnabled(); purgeAll(); return; }
      var files=await mimoAuthFiles(key);
      if(!files.length){ dataCache={ts:Date.now(),entries:[]}; saveCache(); return; }
      /* 并行拉各账号 quota（原先串行，两账号两倍时延） */
      var entries=await Promise.all(files.map(async function(f){
        var name=f.name||f.auth_index||'x';
        return { name:name, f:f, q:await fetchQuotaFor(key,f.auth_index||'') };
      }));
      dataCache={ts:Date.now(),entries:entries};
      saveCache();
    }catch(e){
      /* 拉取失败：有缓存保缓存；没缓存把错误画出来 */
      if(!paintFromCache()){
        var he='<h3>MiMo (Xiaomi) 剩余使用量</h3>'+errorHtml(e.message||e);
        for(var n2 in cards){ var c2=cards[n2]; c2.html=he;
          if(c2.el&&document.body.contains(c2.el)){ c2.el.innerHTML=he; bindCard(c2.el,n2); } }
        if(!Object.keys(cards).length){ paintCard(cardFor('__err__'),'__err__','',errorHtml(e.message||e)); }
        loaded=false;
      }
    } finally { busy=false; }
  }
  async function doRefreshAll(silent){
    await refreshData(silent);
    if(paintFromCache()){ placeCards(); }
    else if(!Object.keys(cards).length){ cardFor('__boot__'); placeCards(); }
    else { placeCards(); }
  }
  async function doRefreshOne(name,silent){
    if(name && name.charAt(0)==='_') return doRefreshAll(silent); /* 占位卡整轮刷新 */
    var key=findKey();
    if(!key) return;
    var en=await pluginEnabled(key);
    if(!en){ invalidateEnabled(); purgeAll(); return; }
    var c=cardFor(name);
    try{
      var files=await mimoAuthFiles(key);
      var f=pickEntry(files,name);
      if(!f) throw new Error('未匹配到凭证 '+name);
      var head=cardHeader(f);
      if(!silent && c.el) c.el.innerHTML=head+loadingHtml();
      var q=await fetchQuotaFor(key,f.auth_index||'');
      paintCard(c,name,head,(q&&q.__error)?errorHtml(q.__error):renderBody(q||{}));
      /* 同步进缓存（数据版本变化 ⇒ paintFromCache 下次会重算） */
      if(dataCache&&dataCache.entries){
        for(var i=0;i<dataCache.entries.length;i++){
          if(dataCache.entries[i].name===name){ dataCache.entries[i]={name:name,f:f,q:q}; }
        }
        dataCache.ts=Date.now(); saveCache();
        lastPaintTs=-1;
      }
    }catch(e){
      paintCard(c,name,'<h3>'+esc(name)+'</h3>',errorHtml(e.message||e));
    }
  }

  /* ================= 7. #/auth-files 额度区（P4 官方同款 DOM） ================= */
  var inlineCache={};
  function isMimoCard(a){
    var t=(a.innerText||'').slice(0,90);
    return /mimo/i.test(t) && !/antigravity/i.test(t);
  }
  function fileNameOf(a){
    /* 实测 DOM（panel-dom-dump.mjs）：mimo 卡没有 fileName 元素，卡内文本是
       account（去扩展名，如 mimo-1000000001），无 .json、无 (userId)。
       取 account/fileName 元素原文（去扩展名归一由 pickEntry 负责）。 */
    var p=a.querySelector('[class*="AuthFileCard-module__account"]') ||
           a.querySelector('p[class*="AuthFileCard-module__fileName"]') ||
           a.querySelector('[class*="AuthFileCard-module__fileName"]');
    if(p && (p.textContent||'').trim()) return p.textContent.trim();
    var txt=a.innerText||'';
    var m=txt.match(/([A-Za-z0-9_.\-]+\.json)/);
    if(m) return m[1];
    var u=txt.match(/\((\d{6,})\)/);
    if(u) return 'mimo-'+u[1]+'.json';
    return '';
  }
  /* 同名多条目时优先带用量 label 的那条（与 mimoAuthFiles 去重一致）；
     name 可能是去扩展名的 account（mimo-1000000001）或完整文件名，
     归一化后对 name / id / 去扩展名三个字段匹配。 */
  function pickEntry(files,name){
    if(!name) return null;
    var norm=String(name).replace(/\.json$/i,'');
    var hit=null;
    for(var i=0;i<files.length;i++){
      var f=files[i];
      var fn=(f.name||'').replace(/\.json$/i,'');
      var fid=(f.id||'').replace(/\.json$/i,'');
      if(fn===norm || fid===norm || (f.name||'')===name || (f.id||'')===name){
        if(!hit){ hit=f; }
        else if(/\d%/.test(f.label||'') && !/\d%/.test(hit.label||'')){ hit=f; }
      }
    }
    return hit;
  }
  function bindSec(sec,name){
    var bs=sec.querySelectorAll('[data-mq-refresh]');
    for(var i=0;i<bs.length;i++){
      bs[i].onclick=function(ev){ if(ev&&ev.preventDefault) ev.preventDefault(); doInline(sec,name); };
    }
  }
  async function doInline(sec,name){
    var key=findKey();
    if(!key){ sec.innerHTML=errorHtml('正在等待面板会话密钥…（硬刷新一次即可）'); return; }
    var en=await pluginEnabled(key);
    if(!en){ invalidateEnabled(); if(sec.parentNode) sec.parentNode.removeChild(sec); delete inlineCache[name]; return; }
    sec.innerHTML=loadingHtml();
    try{
      var files=await mimoAuthFiles(key);
      var f=pickEntry(files,name);
      /* 不再 fallback files[0]：那会让不同账号的卡片显示同一份余量（串卡）。
         匹配不上就如实报错，等下一轮自动重试。 */
      if(!f) throw new Error(files.length ? ('未匹配到凭证 '+name+'（等下一轮重试）') : '未找到 mimo 凭证');
      var q=await fetchQuotaFor(key,f.auth_index||'');
      if(q&&q.__error) throw new Error(q.__error);
      var h=renderBody(q||{},'')+actionsHtml();
      sec.innerHTML=h; inlineCache[name]=h; bindSec(sec,name);
    }catch(e){
      var h2=errorHtml(e.message||e)+idleHtml();
      sec.innerHTML=h2; inlineCache[name]=h2; bindSec(sec,name);
    }
  }
  function injectAuthQuotas(){
    if(!isAuthRoute() || loggedOut()) return;
    var C=authCls();
    var arts=document.querySelectorAll('article[class*="AuthFileCard-module__card"]');
    for(var i=0;i<arts.length;i++){
      var a=arts[i];
      if(!isMimoCard(a)) continue;
      var sec=a.querySelector('[data-mq-inline]');
      if(sec && document.body.contains(a)) continue; /* 幂等 */
      var name=fileNameOf(a);
      sec=document.createElement('div');
      sec.className=C.quotaSection; sec.setAttribute('data-mq-inline','1');
      sec.setAttribute('data-mq-name',name);
      sec.innerHTML=inlineCache[name]||idleHtml();
      var footer=a.querySelector('footer');
      if(footer) a.insertBefore(sec,footer); else a.appendChild(sec);
      bindSec(sec,name);
    }
  }
  function purgeAll(){
    wipeCards(); loaded=false;
    var els=document.querySelectorAll('[data-mq-inline]');
    for(var i=0;i<els.length;i++){ if(els[i].parentNode) els[i].parentNode.removeChild(els[i]); }
  }

  /* ================= 8. 调度（P1/P2/P3，统一启用闸门） ================= */
  var timer=null;
  /* P1 拉锯战修复：v6 只在 schedule/doRefresh 查 enabled，observer/2s 轮询仍
     无条件 placeCard ⇒ purge 后 2 秒内复活（probe 实测）。v6.1 把所有渲染入口
     统一收口到 maybeRender()：确认禁用（pluginEnabled=false）期间
     placeCard/injectAuthQuotas 根本不会被调用。pluginEnabled 有 30s 缓存，
     高频调度不产生 API 流量；用户重新启用插件后最多 30s 自动恢复。 */
  function renderPass(fetchData){
    if(isQuotaRoute() && !tabFilteredOut()){
      /* 快照为空才从缓存恢复 —— 千万不能在 observer 的每次巡检里重算渲染：
         renderBody 的「X 分钟后刷新」每次都变，innerHTML 幂等比较永远不等 ⇒
         写 DOM→observer→重算的无限风暴会堵死主线程（v7.3 实测 evaluate 排队
         57s 的根因）。重算只发生在数据刷新完成时（doRefreshAll）。 */
      if(!Object.keys(cards).length){ if(!paintFromCache()) cardFor('__boot__'); }
      placeCards();
      if(fetchData || cacheStale()){ doRefreshAll(true); }
    } else if(Object.keys(cards).length){ removeCards(); }
    if(isAuthRoute()){ injectAuthQuotas(); }
    else {
      var inj=document.querySelectorAll('[data-mq-inline]');
      for(var i=0;i<inj.length;i++){ if(inj[i].parentNode) inj[i].parentNode.removeChild(inj[i]); }
    }
  }
  function maybeRender(fetchData){
    if(loggedOut()){ purgeAll(); return; }
    var key=findKey();
    if(!key){ renderPass(fetchData); return; } /* 密钥未捕获：先渲染 idle，key 到手后 KEY_EVT 重新过闸 */
    pluginEnabled(key).then(function(ok){
      if(!ok){ purgeAll(); return; }
      renderPass(fetchData);
    });
  }
  function schedule(){
    if(loggedOut()){ purgeAll(); return; }
    maybeRender(true); /* 路由进入/切换：过闸 + 静默加载数据 */
    if(timer) clearInterval(timer);
    timer=setInterval(function(){ maybeRender(true); },60000); /* 60s 静默刷新 */
  }
  window.addEventListener(KEY_EVT,function(){
    /* key 由密文刷新为明文（面板加密迁移场景）或首次捕获：重新过闸并加载 */
    maybeRender(true);
  });
  window.addEventListener('hashchange',function(){ schedule(); });
  /* P2 核心修复：observer 幂等重建（去掉 contains(card) 短路），
     React 把卡片从 grid 丢弃后同 tick 恢复，不再有 0~2s 空窗闪烁；
     渲染本身仍受 maybeRender 启用闸门约束（fetchData=false：只归位不打 API） */
  try{
    new MutationObserver(function(){ maybeRender(); }).observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
  setInterval(function(){ maybeRender(); },2000);
  /* 预取：IIFE 执行即拉数据（比 React 渲染 grid 早），DOM 就绪时数据已在缓存 ⇒ 秒显 */
  loadCache();
  refreshData(true);
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',schedule); }
  else { schedule(); }
})();
</script>
