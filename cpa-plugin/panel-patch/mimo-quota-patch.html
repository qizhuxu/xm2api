     用上次值（API 瞬断 ≠ 插件禁用）。

     根因（v5 源码）：a) MutationObserver 回调条件含
     `card && document.body.contains(card)` —— React 重渲染把外来节点
     （卡片）从 grid 丢弃后该条件为 false，observer 拒绝重建，只能等
     2s 兜底轮询 ⇒ 0~2 秒可见空窗；b) 60s 定时 doRefresh 先把 innerHTML
     换成「正在加载额度...」⇒ 内容闪烁。
     修复：a) observer/轮询改为无条件幂等 placeCard()（内部校验父节点，
     React 移除后同 tick 从 lastHtml 恢复）；b) 自动刷新 silent 模式：
     不写 loading，数据不变不动 DOM，仅用户点击才显示加载反馈。

     修复：删除 fallback —— grid 不存在一律不渲染；另检测面板登录页
     DOM（LoginPage-module__*，bundle 实测 class：loginCard___OgP-R），
     命中即 purgeAll()。grid 存在 = 已登录且身处 QuotaPage，唯一合法挂点。

     v5 的 panelQuotaClasses() 在 antigravity 卡不在场/未渲染时 fallback

     align-items:stretch 把无样式 button 拉成通栏灰底黑框 = 用户截图。
     修复：a) 内置从 bundle 提取的 AuthFileQuota-module__* 完整 class map
     （hash 后缀含连字符的真实值），live DOM 存在时优先覆盖（面板升级自愈）；
     b) idle/loading/error/数据态全部按官方语汇渲染；c) 数据态复刻官方
     antigravity Body（VO 组件）+ 进度条（SO 组件）结构与阈值：
        div.antigravityQuotaGroup > div.antigravityQuotaGroupHeader
          > span.antigravityQuotaGroupTitle(分组名)
        + div.quotaRow > div.quotaRowHeader
            > span.quotaModel(bucket.label|window)
            + div.quotaMeta > span.quotaPercent(「剩余 X%」/「额度可用」)
                            + span.quotaReset[+quotaResetRelativeSoon]
                              (「X 天 Y 小时 后刷新」/「可刷新」，≤24h 为 soon)
          + div.quotaBar > div.quotaBarFill + High|Medium|Low
            （SO 组件阈值：>=70 High(success)、>=30 Medium、<30 Low(failure)；
             style.width=percent%、--meter-index=序号）
     i18n 文案与 bundle zh 资源逐字对齐（bundle @antigravity_quota）：
       idle=点击此处刷新额度 loading=正在加载额度... plan_label=套餐
       remaining_percent=剩余 {{percent}}% quota_available=额度可用
       refreshes_in={{duration}} 后刷新 refresh_button=刷新额度
       duration_day_hour={{days}} 天 {{hours}} 小时 等
     React 重建 auth 卡片后由 inlineCache 恢复已加载内容（同 P2 思路）。

  数据源：GET /v0/management/plugins/mimo/quota?auth_index=<idx>
  （插件 quota_provider 标准端点，normalized {subscription/summary/groups}），
  失败回退 POST /v0/management/quota/fetch。
  密钥仍零配置：fetch/XHR hook 捕获面板会话 Authorization（先于 bundle 执行）。

  上游展望：官方面板若为 supports_quota=true 的插件条目做通用 adapter，
  本补丁即可退场。

  应用方法（Linux/Windows 通用，**必须走脚本**，别手写 python 注入了）：
    1. config.yaml：remote-management.disable-auto-update-panel: true
    2. node apply-patch.mjs --bin <CPA bin 目录>       # 本目录下，零依赖
         - 从 static/management.html.orig 还原干净原版（勿在旧补丁上叠加）
         - 在第一个 <head> 之后注入本文件
         - 注入前用 vm.Script 解析内联 <script>：语法错就直接中止并保留原文件
           （v7.4.1 的 `__mimoQuotaPatch=7.4.1` 就是这么静默炸掉的）
         - 自动备份上一版到 static/management.html.prev
      默认 bin 目录：%TEMP%\cpa-test\bin（可用 --bin 覆盖；--dry-run 只校验）
    3. 硬刷新面板页面（Ctrl+F5；静态文件，无需重启 CPA）。

<style>
/* v7.4.1：官方 AuthFileCard 入场动画按序号 stagger（0s/0.18s/0.36s…）会让
   后面的卡「一个一个」慢慢浮现（DOM 早就好了，只是动画没轮到）。归零
   animation-delay，所有卡与第一张（Antigravity）同时入场；淡入本身保留。 */
article[class*="AuthFileCard-module__card"]{animation-delay:0s !important}
/* v7.5：插件禁用期间整卡隐藏（宿主仍会把这些 auth 文件列出来，见 R13）。
   用属性选择器而不是 inline style —— React 重建卡片时不会带上我们的 inline，
   但我们的每轮 renderPass 会重新打标记，属性+CSS 让中间态也不会“闪一下”。 */
article[data-mq-hidden="1"]{display:none !important}
/* v7.6：#/quota 卡片不再有任何自造样式 —— 卡壳走 QuotaCard-module、数据相走
   QuotaBody-module，全部复用面板 bundle 的官方 CSS（对齐 antigravity）。 */
</style>
<script>
/* MiMo quota patch v7.6 — 见文件头注释。密钥只驻留内存变量，不落盘、不外发。 */
(function(){
  if(window.__mimoQuotaPatch) return; window.__mimoQuotaPatch='7.8';

  /* ================= 1. 会话密钥自动捕获（先于面板 bundle 执行） ================= */
  var KEY_EVT='mimo-key-captured';
  function capture(v){
    if(!v) return;
    var key=String(v).replace(/^Bearer\s+/i,'').trim();
    if(!key) return;
    var isNew=!window.__mimoMgmtKey, changed=window.__mimoMgmtKey!==key;
    window.__mimoMgmtKey=key;
    /* 值变化也触发：面板启动时会把 localStorage 的明文 managementKey 加密迁移
       （El.migratePlaintextKeys），早先 fallback 捕获的密文要能被 hook 拿到的明文
       覆盖并唤醒自动加载链（KEY_EVT）。同值不重复触发，无事件风暴。 */
    if(isNew||changed){ try{ window.dispatchEvent(new Event(KEY_EVT)); }catch(e){} }
  }
  try{
    var of=window.fetch;
    if(of){
      window.fetch=function(req,init){
        /* 面板自己的插件开关动作与插件列表响应一并利用（R12）：
           PATCH /v0/management/plugins/<id>/enabled 是权威意图，直接按它更新
           门闸缓存；GET 的 plugins 响应 clone 出来同步（别的页面/客户端改的
           开关也能跟上）。这里只读不改，原请求原样发出。 */
        var url='', method='GET';
        try{
          url=String((req&&req.url)||req||'');

  /* i18n：与 bundle zh 资源 antigravity_quota.* 逐字一致 */
  var T={idle:'点击此处刷新额度',loading:'正在加载额度...',loadFailed:'额度获取失败：',
    empty:'暂无额度数据',planLabel:'套餐',available:'额度可用',
    refreshBtn:'刷新额度',refreshAvailable:'可刷新',
    oauthBtn:'刷新 OAuth 凭证',oauthPending:'刷新中…',oauthOK:'已提交刷新请求',oauthFail:'刷新失败'};

  function fmtDur(ms){
    var m=Math.max(1,Math.round(ms/60000));
    var d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mi=m%60;
    if(d>0) return d+' 天 '+h+' 小时';       /* duration_day_hour */
    if(h>0) return h+' 小时 '+mi+' 分钟';     /* duration_hour_minute */
    return mi+' 分钟';                        /* duration_minute */
  }
  function fmtReset(rt){
    if(!rt) return {txt:'',soon:false};
    var t=new Date(rt).getTime()-Date.now();
    if(!isFinite(t)) return {txt:'',soon:false};
    if(t<=0) return {txt:T.refreshAvailable,soon:true};
    return {txt:fmtDur(t)+' 后刷新',soon:t<=24*3600*1000}; /* refreshes_in */
  }
  function quotaBits(q){
    var out={pct:null,plan:''};
    out.plan=(q&&q.subscription&&q.subscription.plan)||'';
    (q&&q.groups||[]).forEach(function(g){
      (g.buckets||[]).forEach(function(b){
        if(out.pct===null && typeof b.remainingFraction==='number') out.pct=b.remainingFraction*100;
      });
    });
    if(out.pct===null && q&&q.summary){
      (q.summary||[]).forEach(function(s){ if(out.pct===null && typeof s.value==='number') out.pct=s.value; });
    }
    return out;
  }

  /* ================= 5. 官方 Body 结构复刻（VO + SO，bundle JSX 实测） ================= */
  function barHtml(pct,idx,C){
    var r=(pct===null)?null:Math.max(0,Math.min(100,pct));
    var fill=(r===null)?C.quotaBarFillMedium:(r>=70?C.quotaBarFillHigh:(r>=30?C.quotaBarFillMedium:C.quotaBarFillLow));
    var w=(r===null)?0:(Math.round(r*100)/100);
    return '<div class="'+C.quotaBar+'"><div class="'+C.quotaBarFill+' '+fill+
      '" style="width:'+w+'%;--meter-index:'+idx+'"></div></div>';
  }
  /* C = 类名映射：#/quota 传 QB（QuotaBody-module），#/auth-files 传 authCls()。
     同一套 VO 结构，两页各用官方自己的类体系（v7.6 对齐所需）。 */
  function renderBody(q,titlePrefix,C){
    C=C||authCls();
    var b=quotaBits(q), h='', idx=0;
    if(b.plan){
      h+='<div class="'+C.codexPlan+'"><span class="'+C.codexPlanItem+'">'+
        '<span class="'+C.codexPlanLabel+'">'+T.planLabel+'</span>'+
        '<span class="'+C.codexPlanValue+'">'+esc(b.plan)+'</span></span></div>';
    }
    var groups=(q&&q.groups)||[];
    if(!groups.length){
      if(b.pct===null) return h+'<div class="'+C.quotaMessage+'">'+T.empty+'</div>';
      /* summary-only 回退：单行渲染 */
      var pctTxt=(b.pct>=99.95)?T.available:('剩余 '+Math.round(b.pct)+'%');
      h+='<div class="'+C.antigravityQuotaGroup+'"><div class="'+C.antigravityQuotaGroupHeader+'">'+
        '<span class="'+C.antigravityQuotaGroupTitle+'">'+esc(titlePrefix||'')+'</span></div>'+
        '<div class="'+C.quotaRow+'"><div class="'+C.quotaRowHeader+'">'+
        '<span class="'+C.quotaModel+'">—</span>'+
        '<div class="'+C.quotaMeta+'"><span class="'+C.quotaPercent+'">'+esc(pctTxt)+'</span></div>'+
        '</div>'+barHtml(b.pct,idx++,C)+'</div></div>';
      return h;
    }
    groups.forEach(function(g){
      var title=g.displayName||g.label||'';
      if(titlePrefix) title=(titlePrefix?(titlePrefix+(title?(' · '+title):'')):title);
      h+='<div class="'+C.antigravityQuotaGroup+'"><div class="'+C.antigravityQuotaGroupHeader+'">'+
        '<span class="'+C.antigravityQuotaGroupTitle+'">'+esc(title)+'</span>'+
        (g.description?('<span class="'+C.antigravityQuotaGroupDescription+'">'+esc(g.description)+'</span>'):'')+
        '</div>';
      (g.buckets||[]).forEach(function(bk){
        var pct=(typeof bk.remainingFraction==='number')?Math.max(0,Math.min(1,bk.remainingFraction))*100:null;
        var pctTxt=(pct===null)?'':((pct>=99.95)?T.available:('剩余 '+Math.round(pct)+'%'));
        var rst=fmtReset(bk.resetTime);
        h+='<div class="'+C.quotaRow+'"><div class="'+C.quotaRowHeader+'">'+
          '<span class="'+C.quotaModel+'" title="'+esc(bk.description||'')+'">'+esc(bk.label||bk.window||'—')+'</span>'+
          '<div class="'+C.quotaMeta+'">'+
          (pctTxt?('<span class="'+C.quotaPercent+'">'+esc(pctTxt)+'</span>'):'')+
          (rst.txt?('<span class="'+C.quotaReset+(rst.soon?(' '+C.quotaResetRelativeSoon):'')+'">'+esc(rst.txt)+'</span>'):'')+
          '</div></div>'+barHtml(pct,idx++,C)+'</div>';
      });
      h+='</div>';
    });
    return h;
  }
  function idleHtml(){ var C=authCls(); return '<button type="button" class="'+C.quotaMessage+' '+C.quotaMessageAction+'" data-mq-refresh>'+T.idle+'</button>'; }
  function loadingHtml(){ var C=authCls(); return '<div class="'+C.quotaMessage+'">'+T.loading+'</div>'; }
  function errorHtml(msg){ var C=authCls(); return '<div class="'+C.quotaError+'">'+T.loadFailed+esc(msg)+'</div>'; }
  function actionsHtml(){ var C=authCls(); return '<div class="'+C.quotaCardActions+'"><button type="button" class="'+C.quotaMessage+' '+C.quotaMessageAction+'" data-mq-refresh>'+T.refreshBtn+'</button></div>'; }

  /* ---- v7.6：#/quota 卡片各状态的 body（QuotaCard-module 官方原语） ---- */
  function qIdleHtml(){
    return '<button type="button" class="'+QC.idleBody+'" data-mq-refresh>'+
      glyphSvg(QC.idleGlyph)+'<span class="'+QC.idleHint+'">'+T.idle+'</span></button>';
  }
  function qSkeletonHtml(){
    var row='<div class="'+QC.skeletonRow+'"><div class="'+QC.skeletonLabel+'"></div><div class="'+QC.skeletonTrack+'"></div></div>';
    return '<div class="'+QC.skeleton+'">'+row+row+'</div>';
  }
  function qErrorHtml(msg){ return '<div class="'+QC.errorStrip+'">'+T.loadFailed+esc(msg)+'</div>'; }
  function qActionRow(spin){
    return '<div class="'+QC.actionRow+'"><button type="button" class="'+QC.actionPill+'" data-mq-refresh>'+
      glyphSvg((spin?QC.spinning+' ':'')+QC.idleGlyph)+'<span>'+T.refreshBtn+'</span></button></div>';
  }
  /* 卡壳（与官方 antigravity 卡同构）：header(iconWrap+icon, fileName) + body */
  function qShell(name, bodyHtml){
    return '<header class="'+QC.head+'">'+
      '<span class="'+QC.iconWrap+'" title="MiMo">'+
      '<img alt="" class="'+QC.icon+'" src="'+MIMO_ICON+'" '+
      'onerror="this.style.display=\'none\';if(this.nextElementSibling)this.nextElementSibling.style.display=\'flex\'">'+
      '<span class="'+QC.iconFallback+'" style="display:none">M</span></span>'+
      '<span class="'+QC.fileName+'" title="'+esc(name)+'">'+esc(name)+'</span>'+
      '</header>'+
      '<div class="'+QC.body+'">'+bodyHtml+'</div>';
  }

  /* ================= 6. #/quota 网格卡片（v7.6：官方 QuotaCard 同构，默认 idle） ================= */
  /* 每个 mimo 凭证一张 article.QuotaCard-module__card，壳与状态机逐字对齐
     antigravity 实测（recon*.mjs）：默认 body=idleBody「点击此处刷新额度」，
     点击才拉额度；数据相 QuotaBody-module VO + actionPill「刷新额度」；
     失败相 errorStrip。**不预取、不记 sessionStorage** —— 页面重载回默认态。
     快照语义保留（R8/R9 防 observer 风暴）：React 重渲染后从 c.html 恢复，
     巡检不重算渲染。 */
  var cards={};       /* name -> {el, html, state, dataHtml, busy} */
  var filesCache=null; /* mimoAuthFiles 账号清单（只拉它建卡；额度绝不自动拉） */
  var accountsLoading=false;
  function hostGrid(){ return document.querySelector('[class*="QuotaPage-module__grid"]'); }
  /* 只卸 DOM、保留 html 快照（v7 lastHtml 秒恢复语义）—— React 重渲染/路由
     切回时立即恢复显示，不重新走加载链。彻底清空交给 purgeAll。 */
  function removeCards(){ for(var k in cards){ var c=cards[k]; if(c.el&&c.el.parentNode) c.el.parentNode.removeChild(c.el); c.el=null; } }
  function wipeCards(){ removeCards(); cards={}; }
  function removeCardFor(name){ var c=cards[name]; if(c&&c.el&&c.el.parentNode) c.el.parentNode.removeChild(c.el); delete cards[name]; }  function bindCard(el,name){
    var bs=el.querySelectorAll('[data-mq-refresh]');
    for(var i=0;i<bs.length;i++){
      bs[i].onclick=function(ev){
        if(ev&&ev.preventDefault) ev.preventDefault();
        /* __boot__/__none__/__err__ 是占位卡：重试拉账号清单，别拿占位名去匹配凭证 */
        if(name && name.charAt(0)==='_'){ ensureAccounts(true); return; }
        doRefreshOne(name);
      };
    }
  }
  /* P3：grid 不存在 / 登录页 ⇒ 不渲染；grid 瞬时不存在（React 路由过渡）只跳过
     挂载、保留数据 —— 实测切回 #/quota 后 grid 可晚 2s+ 出现，此处清卡会导致
     数据反复被丢、只能等完整加载链（v7.1~v7.3 的「卡一会」根因之一）。 */
  function placeCards(){
    var g=hostGrid();
    if(loggedOut()){ removeCards(); return; }
    if(!g) return;
    for(var name in cards){
      var c=cards[name];
      if(c.el && c.el.parentNode && document.body.contains(c.el)){
        if(c.el.parentNode!==g) g.appendChild(c.el);
      } else {
        c.el=document.createElement('article');
        c.el.className=QC.card+' '+QC.cardEnter;
        c.el.style.setProperty('--card-delay','0ms'); /* 与官方卡一致：同帧浮现 */
        c.el.setAttribute('data-mq-name',name);
        g.appendChild(c.el);
        c.el.innerHTML=c.html||qShell(name,qIdleHtml()); bindCard(c.el,name);
      }
    }
  }
  function cardFor(name){
    if(!cards[name]) cards[name]={el:null,html:'',state:'idle',dataHtml:'',busy:false};
    return cards[name];
  }
  /* bodyHtml = body 内容（idle=大按钮；loading=skeleton；data=VO+actionPill；
     error=errorStrip+actionPill）。卡壳由 qShell 统一组装 ⇒ 结构永远与官方一致。 */
  function paintCard(c,name,bodyHtml){
    var h=qShell(name,bodyHtml);
    c.html=h;
    if(c.el && document.body.contains(c.el) && c.el.innerHTML!==h){ c.el.innerHTML=h; bindCard(c.el,name); }
    return h;
  }
  /* ============== 6.5 账号清单与点击加载（v7.6：额度只在用户点击后拉） ==============
     旧版这里是 SWR 预取层（IIFE 预取 + sessionStorage + 60s 静默刷新），
     加载即显示额度 —— 与官方 antigravity 行为不符，R14 全部移除。
     现在：只拉一次 mimoAuthFiles（账号清单，即页面自己的
     /v0/management/auth-files）用来建卡；额度请求仅由点击 idleBody/actionPill 触发。 */
  async function ensureAccounts(force){
    var key=findKey();
    if(!key){
      /* key 未到：占位 idle 卡（点它在 key 到手后重试），不发任何请求 */
      if(!Object.keys(cards).length){ paintCard(cardFor('__boot__'),'__boot__',qIdleHtml()); placeCards(); }
      return;
    }
    if(!filesCache || force){
      if(accountsLoading) return;
      accountsLoading=true;
      try{
        var en=await pluginEnabled(key);
        if(!en){ accountsLoading=false; invalidateEnabled(); purgeAll(); return; }
        filesCache=await mimoAuthFiles(key);
      }catch(e){
        accountsLoading=false;
        wipeCards();
        paintCard(cardFor('__err__'),'__err__',qErrorHtml(e.message||e)+qActionRow(false));
        placeCards();
        return;
      }
      accountsLoading=false;
    }
    if(!filesCache || !filesCache.length){
      wipeCards();
      paintCard(cardFor('__none__'),'__none__',qIdleHtml());
      placeCards();
      return;
    }
    /* 同步 cards ↔ 账号清单：新增建 idle 卡、消失的移除、已存在的保留快照
       （含用户已点出来的额度 —— 页面内切走切回不清空） */
    var live={};
    for(var i=0;i<filesCache.length;i++){
      var name=filesCache[i].name||filesCache[i].auth_index||('x'+i);
      live[name]=1;
      if(!cards[name]){ paintCard(cardFor(name),name,qIdleHtml()); }
    }
    for(var k in cards){ if(!live[k]) removeCardFor(k); }
    placeCards();
  }
  /* 用户点击（idleBody / actionPill）才拉额度 —— 默认不显示（R14）。
     已有数据时刷新走 spinning 转圈而不是退回 skeleton，不闪。 */
  async function doRefreshOne(name){
    if(!name || name.charAt(0)==='_'){ ensureAccounts(true); return; }
    var key=findKey();
    if(!key) return;
    var en=await pluginEnabled(key);
    if(!en){ invalidateEnabled(); purgeAll(); return; }
    var c=cardFor(name);
    if(c.busy) return;
    c.busy=true;
    if(c.state==='data' && c.dataHtml){ paintCard(c,name,c.dataHtml+qActionRow(true)); }
    else { c.state='loading'; paintCard(c,name,qSkeletonHtml()); }
    try{
      var files=filesCache||await mimoAuthFiles(key);
      var f=pickEntry(files,name);
      if(!f) throw new Error('未匹配到凭证 '+name);
      var q=await fetchQuotaFor(key,f.auth_index||'');
      if(q&&q.__error) throw new Error(q.__error);
      c.state='data'; c.dataHtml=renderBody(q||{},'',QB);
      paintCard(c,name,c.dataHtml+qActionRow(false));
    }catch(e){
      c.state='error'; c.dataHtml='';
      paintCard(c,name,qErrorHtml(e.message||e)+qActionRow(false));
    }
    c.busy=false;
  }

  /* ================= 7. #/auth-files 额度区（P4 官方同款 DOM） ================= */
  var inlineCache={};
  function isMimoCard(a){
    var t=(a.innerText||'').slice(0,90);
    return /mimo/i.test(t) && !/antigravity/i.test(t);
  }
  function fileNameOf(a){
    /* 实测 DOM（test/panel/panel-dom-dump.mjs）：mimo 卡没有 fileName 元素，卡内文本是
       account（去扩展名，如 mimo-1000000001），无 .json、无 (userId)。
       取 account/fileName 元素原文（去扩展名归一由 pickEntry 负责）。 */
    var p=a.querySelector('[class*="AuthFileCard-module__account"]') ||
           a.querySelector('p[class*="AuthFileCard-module__fileName"]') ||
           a.querySelector('[class*="AuthFileCard-module__fileName"]');
    if(p && (p.textContent||'').trim()) return p.textContent.trim();
    var txt=a.innerText||'';
    var m=txt.match(/([A-Za-z0-9_.\-]+\.json)/);
    if(m) return m[1];
    var u=txt.match(/\((\d{6,})\)/);
    if(u) return 'mimo-'+u[1]+'.json';
    return '';
  }
  /* 同名多条目时优先带用量 label 的那条（与 mimoAuthFiles 去重一致）；
     name 可能是去扩展名的 account（mimo-1000000001）或完整文件名，
     归一化后对 name / id / 去扩展名三个字段匹配。 */
  function pickEntry(files,name){
    if(!name) return null;
    var norm=String(name).replace(/\.json$/i,'');
    var hit=null;
    for(var i=0;i<files.length;i++){
      var f=files[i];
      var fn=(f.name||'').replace(/\.json$/i,'');
      var fid=(f.id||'').replace(/\.json$/i,'');
      if(fn===norm || fid===norm || (f.name||'')===name || (f.id||'')===name){
        if(!hit){ hit=f; }
        else if(/\d%/.test(f.label||'') && !/\d%/.test(hit.label||'')){ hit=f; }
      }
    }
    return hit;
  }
  function bindSec(sec,name){
    var bs=sec.querySelectorAll('[data-mq-refresh]');
    for(var i=0;i<bs.length;i++){
      bs[i].onclick=function(ev){ if(ev&&ev.preventDefault) ev.preventDefault(); doInline(sec,name); };
    }
  }
  /* v7.8：官方同款「刷新 OAuth 凭证」图标按钮（footer utilityActions 首位，
     「模型」与「下载」之间）。官方面板只对内置 6 家渲染该按钮（bundle 实测
     门槛 Set{meta,antigravity,claude,codex,kimi,xai}），这里给 mimo 补同款：
     图标与类名**优先从页面上的官方按钮克隆**（不重复造轮子），克隆不到时用
     bundle 实测的官方 SVG 兜底（Cs=RotateCw 两段 path；spinner=Loader2）。 */
  var OFFICIAL_REFRESH_SVG='<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>';
  var OFFICIAL_SPINNER_SVG='<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
  function iconBtnClass(){
    var b=document.querySelector('button[class*="iconButton"]');
    if(b){ var m=String(b.className).match(/[\w-]*iconButton[\w-]*/); if(m) return m[0]; }
    var sheets=document.styleSheets||[];
    for(var i=0;i<sheets.length;i++){
      var rules; try{ rules=sheets[i].cssRules; }catch(e){ continue; }
      for(var j=0;j<rules.length;j++){
        var sel=(rules[j]&&rules[j].selectorText)||'';
        var m2=sel.match(/\.([\w-]*iconButton[\w-]*)/);
        if(m2 && /AuthFileCard/.test(sel)) return m2[1];
      }
    }
    return 'AuthFileCard-module__iconButton___XdMXe'; /* bundle 实测类名（构建变体不同则走上两级发现） */
  }
  function injectFooterOAuth(card,name,sec){
    var ua=card.querySelector('div[class*="utilityActions"]');
    if(!ua || ua.querySelector('[data-mq-oauth]')) return;
    var tpl=document.querySelector('button[class*="iconButton"][title*="刷新 OAuth"]');
    var btn;
    if(tpl){
      btn=tpl.cloneNode(true);          /* 官方按钮整颗克隆：类名/图标/尺寸逐字一致 */
      btn.onclick=null;
    }else{
      btn=document.createElement('button');
      btn.type='button';
      btn.className='btn btn-secondary btn-sm '+iconBtnClass();
      btn.innerHTML=OFFICIAL_REFRESH_SVG;
    }
    btn.title=T.oauthBtn;
    btn.setAttribute('data-mq-oauth','1');
    btn.onclick=function(ev){ if(ev&&ev.preventDefault) ev.preventDefault(); doOAuthRefresh(card,name,btn,sec); };
    ua.insertBefore(btn,ua.firstChild);
  }
  async function doOAuthRefresh(card,name,btn,sec){
    var key=findKey();
    if(!key){ btn.title='正在等待面板会话密钥…（硬刷新一次即可）'; return; }
    var origHtml=btn.innerHTML, origTitle=btn.title;
    btn.disabled=true;
    btn.innerHTML=OFFICIAL_SPINNER_SVG;
    btn.title=T.oauthPending;
    try{
      var files=await mimoAuthFiles(key);
      var f=pickEntry(files,name);
      if(!f) throw new Error('未匹配到凭证 '+name);
      var r=await fetch('/v0/management/auth-files/refresh',{method:'POST',
        headers:{'Authorization':'Bearer '+key,'X-Management-Key':key,'content-type':'application/json'},
        body:JSON.stringify({name:f.name, auth_index:f.auth_index||''})});
      var j=null; try{ j=await r.json(); }catch(e2){ j=null; }
      if(!r.ok) throw new Error('HTTP '+r.status);
      if(j&&j.__error) throw new Error(j.__error);
      btn.title=T.oauthOK;
    }catch(e){
      btn.title=T.oauthFail+'：'+(e.message||e);
    }
    setTimeout(function(){
      btn.innerHTML=origHtml;
      btn.title=origTitle||T.oauthBtn;
      btn.disabled=false;
      if(sec&&document.body.contains(sec)) doInline(sec,name); /* 续期后顺手刷额度带 */
    },3000);
  }
  async function doInline(sec,name){
    var key=findKey();
    if(!key){ sec.innerHTML=errorHtml('正在等待面板会话密钥…（硬刷新一次即可）'); return; }
    var en=await pluginEnabled(key);
    if(!en){ invalidateEnabled(); purgeAll(); return; }
    sec.innerHTML=loadingHtml();
    try{
      var files=await mimoAuthFiles(key);
      var f=pickEntry(files,name);
      /* 不再 fallback files[0]：那会让不同账号的卡片显示同一份余量（串卡）。
         匹配不上就如实报错，等下一轮自动重试。 */
      if(!f) throw new Error(files.length ? ('未匹配到凭证 '+name+'（等下一轮重试）') : '未找到 mimo 凭证');
      var q=await fetchQuotaFor(key,f.auth_index||'');
      if(q&&q.__error) throw new Error(q.__error);
      var h=renderBody(q||{},'')+actionsHtml();
      sec.innerHTML=h; inlineCache[name]=h; bindSec(sec,name);
    }catch(e){
      var h2=errorHtml(e.message||e)+idleHtml();
      sec.innerHTML=h2; inlineCache[name]=h2; bindSec(sec,name);
    }
  }
  /* v7.5（R13）：插件禁用期间整卡隐藏。宿主不会把 mimo 的 auth 文件摘掉
     （禁用后 /v0/management/auth-files 里仍是 status=active / unavailable=false，
     只是 supports_quota、quota_provider 两个字段消失），官方面板照常渲染成
     「一切正常」的卡片 —— 实际这些凭证一个都用不了。所以由补丁整卡隐藏，
     启用后摘标记恢复（不销毁节点，React 那边完全无感）。 */
  function mimoAuthCards(){
    var out=[], arts=document.querySelectorAll('article[class*="AuthFileCard-module__card"]');
    for(var i=0;i<arts.length;i++){ if(isMimoCard(arts[i])) out.push(arts[i]); }
    return out;
  }
  function gateAuthCards(enabled){
    var arts=mimoAuthCards();
    for(var i=0;i<arts.length;i++){
      var a=arts[i];
      if(enabled){
        if(a.getAttribute('data-mq-hidden')==='1') a.removeAttribute('data-mq-hidden');
      } else if(a.getAttribute('data-mq-hidden')!=='1'){
        a.setAttribute('data-mq-hidden','1');
      }
    }
    return arts.length;
  }
  function injectAuthQuotas(){
    if(!isAuthRoute() || loggedOut()) return;
    var C=authCls();
    var arts=document.querySelectorAll('article[class*="AuthFileCard-module__card"]');
    for(var i=0;i<arts.length;i++){
      var a=arts[i];
      if(!isMimoCard(a)) continue;
      var sec=a.querySelector('[data-mq-inline]');
      if(sec && document.body.contains(a)) continue; /* 幂等 */
      var name=fileNameOf(a);
      sec=document.createElement('div');
      sec.className=C.quotaSection; sec.setAttribute('data-mq-inline','1');
      sec.setAttribute('data-mq-name',name);
      sec.innerHTML=inlineCache[name]||idleHtml();
      var footer=a.querySelector('footer');
      if(footer) a.insertBefore(sec,footer); else a.appendChild(sec);
      bindSec(sec,name);
      injectFooterOAuth(a,name,sec); /* v7.8：官方同款图标按钮进 footer */
    }
  }
  function purgeAll(){
    wipeCards();
    var els=document.querySelectorAll('[data-mq-inline]');
    for(var i=0;i<els.length;i++){ if(els[i].parentNode) els[i].parentNode.removeChild(els[i]); }
    gateAuthCards(false); /* 禁用闸门：官方 mimo 卡片一并隐藏（R13） */
  }

  /* ================= 8. 调度（P1/P2/P3，统一启用闸门） ================= */
  var timer=null;
  /* P1 拉锯战修复：v6 只在 schedule/doRefresh 查 enabled，observer/2s 轮询仍
     无条件 placeCard ⇒ purge 后 2 秒内复活（probe 实测）。v6.1 把所有渲染入口
     统一收口到 maybeRender()：确认禁用（pluginEnabled=false）期间
     placeCard/injectAuthQuotas 根本不会被调用。
     v7.5：门闸状态不再只靠 TTL 轮询 —— 面板自己的开关动作（PATCH
     /v0/management/plugins/<id>/enabled）与 plugins 列表响应都会即时刷新缓存
     （见第 1、3 节），TTL 降到 10s 兜底 ⇒ 开关按下即生效，无需刷新页面。 */
  function renderPass(){
    if(isQuotaRoute() && !tabFilteredOut()){
      /* v7.6：只建 idle 卡（拉账号清单），额度绝不自动拉 —— 巡检永远不动
         卡片内容（快照恢复语义），因此不存在 observer 风暴面。 */
      ensureAccounts();
      placeCards();
    } else if(Object.keys(cards).length){ removeCards(); }
    if(isAuthRoute()){ injectAuthQuotas(); }
    else {
      var inj=document.querySelectorAll('[data-mq-inline]');
      for(var i=0;i<inj.length;i++){ if(inj[i].parentNode) inj[i].parentNode.removeChild(inj[i]); }
    }
  }
  function maybeRender(){
    if(loggedOut()){ purgeAll(); return; }
    var key=findKey();
    if(!key){ renderPass(); return; } /* 密钥未捕获：先渲染 idle，key 到手后 KEY_EVT 重新过闸 */
    pluginEnabled(key).then(function(ok){
      if(!ok){ purgeAll(); return; }
      gateAuthCards(true); /* 闸门放行 ⇒ 恢复被隐藏的官方 mimo 卡片（R13） */
      renderPass();
    });
  }
  function schedule(){
    if(loggedOut()){ purgeAll(); return; }
    maybeRender(); /* 路由进入/切换：过闸 + 建 idle 卡（不拉额度） */
    if(timer) clearInterval(timer);
    timer=setInterval(function(){ maybeRender(); },60000); /* 只做 DOM 归位，不拉数据（R14） */
  }
  window.addEventListener(KEY_EVT,function(){
    /* key 由密文刷新为明文（面板加密迁移场景）或首次捕获：重新过闸并建卡 */
    maybeRender();
  });
  window.addEventListener('hashchange',function(){ schedule(); });
  /* P2 核心修复：observer 幂等重建（去掉 contains(card) 短路），
     React 把卡片从 grid 丢弃后同 tick 恢复，不再有 0~2s 空窗闪烁；
     渲染本身仍受 maybeRender 启用闸门约束（fetchData=false：只归位不打 API） */
  try{
    new MutationObserver(function(){ maybeRender(); }).observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
  setInterval(function(){ maybeRender(); },2000);
  /* 预取（R14 移除）：额度不再预取 —— 建卡由 schedule/ensureAccounts 负责，
     额度只在用户点击 idleBody/actionPill 后拉。 */
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',schedule); }
  else { schedule(); }
})();
</script>
