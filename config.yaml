# xm2api 配置
#
# 改完重启服务生效（凭证相关项下次跑 creds 时生效）。
# 环境变量优先级高于本文件，见每一节的说明。
# 只想快速改端口的话：XM2API_PORT=18790 npm run serve

server:
  # 监听地址。别改成 0.0.0.0 —— 服务没有鉴权
  # 环境变量：XM2API_HOST
  host: 127.0.0.1

  # 监听端口
  # 环境变量：XM2API_PORT
  port: 18787

  # 上游地址。一般不用动；指向本地回显服务器可用来验证反代是否篡改请求
  # 环境变量：XM2API_MIMO_SERVER
  upstream: https://mimo-server-cn.xiaomimimo.com

  # GET /v1/models 的模型清单来源：
  #   upstream      → 从上游 /api/model/list 实时拉取（默认，含全部模型：TEXT/TTS/ASR/图像）
  #   [a, b, ...]   → 写死一个列表，例如 [mimo-pro, mimo-flash]
  # 结果缓存 5 分钟（XM2API_MODELS_TTL_MS 可改）；上游失败时回落兜底清单，不会 500
  models: upstream

  # 只暴露某些类型（留空 = 全部）。可选：TEXT / TTS / ASR / IMAGE_GENERATION
  # 例：只想让客户端看到能用于 chat/completions 的模型，就填 [TEXT]
  modelTypes: []

  # 上游多久没响应算超时（毫秒）。流式是按"空闲"计时，有分片就重置。
  # 图像生成单次约 40 秒，联网搜索 5~13 秒，所以给足 5 分钟。
  # 环境变量：XM2API_UPSTREAM_TIMEOUT_MS
  upstreamTimeoutMs: 300000

  # 管理密钥（前端管理界面 /ui/ 登录、X-Management-Key 请求头）。
  # 优先级：env XM2API_ADMIN_KEY > 下面这行 > data/admin-key.txt（首启自动生成）。
  # ⚠️ 想固定密钥优先用环境变量；写进本文件请勿把本文件提交到公开仓库。
  # adminKey: "在这里填你的管理密钥"

  # 安全护栏白名单（见 lib/admin.mjs）：
  #   allowedHosts   允许的 Host 头（默认只认本机回环，防 DNS rebinding）；
  #                  Docker / 反代 / 自建域名场景按 host:port 精确加白，如
  #                  ["myserver.com:8080"]；"%" 开头可作前缀通配（如 ["%:8080"]）；
  #                  ⚠️ "*" 放开全部（仅建议内网/容器网桥场景）
  #   allowedOrigins 允许的跨站 Origin（默认只认同源）；同上支持 "*" 通配
  # 环境变量：XM2API_ALLOWED_HOSTS / XM2API_ALLOWED_ORIGINS（逗号分隔）
  allowedHosts: []
  allowedOrigins: []

  # —— 账号池与自动续期（二期）——
  # 转发从 data/accounts/ round-robin 选号；坏号（401/403）冷却 cooldownMs 并换号；
  # 池空/关闭 ⇒ 回落 sso-session 单会话。
  pool:
    enabled: true
    strategy: round-robin
    cooldownMs: 300000
  # 转发 401 自动续期：pass_token 续期→原号重试，失败换号；只回马一次；流式不重试
  autoRenew: true
  # 定时兜底续期（毫秒，0=纯 401 事件驱动）
  refreshAfterMs: 21600000

  # 请求体兼容层。反代默认逐字节透传，只有命中下面规则才会改写。
  compat:
    # ① 翻译档：上游只认 tools:[{type:"web_search"}] 才会联网；写 web_search:{enable:true}、
    #    enable_search:true、search:{...} 都会被上游静默忽略（模型会嘴硬说"我没有联网能力"）。
    #    打开后：
    #      {"web_search": true}                            → tools += {"type":"web_search"}
    #      {"web_search": {"limit":5,"force_search":true}} → tools += {"type":"web_search","limit":5,"force_search":true}
    #      {"web_search": false}                           → 删掉这个键（本次不联网）
    #    每次改写都会写进日志的 request.rewrites。
    #    关掉它 = 不再翻译。环境变量：XM2API_COMPAT_WEBSEARCH=0
    #    详见 docs/tools-and-search.md
    webSearchFlag: true

    # ② 主动档（默认开）：**不带 tools 的** TEXT 聊天请求会注入裸 tools:[{type:"web_search"}]，
    #    由模型自己决定搜不搜。实测普通问题（"1+1=?"）prompt_tokens 不变、耗时不变，
    #    只有真触发搜索时才多花 6000+ tokens 和几秒；时效性问题（"今天…"）会自己去搜。
    #    ⚠️ 开了它，这类请求的 body 会被改写 —— 不再是逐字节透传。
    #       想要"你不要求就一个字都不改"，把它设成 false。
    #    ⚠️ 调用方自带 tools（函数调用 / agent）时**一概不插手** —— 实测无脑追加会让
    #       模型改去联网、不调你自己的函数。那种场景要联网请显式写 "web_search": true。
    #    注意：只对 TEXT 模型注入（TTS/ASR 也走 chat/completions，塞工具会坏事）；
    #    想单次关掉就在该请求里写 "web_search": false。
    #    环境变量：XM2API_COMPAT_WEBSEARCH_AUTO=0
    webSearchAuto: true

credentials:
  # SSO 交换用的 sid：
  #   mimopc       → 聊天 route（默认，反代用这个）
  #   passportapi  → 账号信息
  # 环境变量：XM2API_SID
  sid: mimopc

logging:
  # 关掉就完全不写日志文件，也不往 stdout 打请求详情
  # 环境变量：XM2API_LOG=off
  enabled: true

  # 日志目录（相对项目根，或写绝对路径）
  dir: logs

  # 是否把请求体/响应体写进日志。
  # false = 只记状态码/耗时/请求头/trace-id，不落对话内容（更隐私，日志更小）
  # 环境变量：XM2API_LOG_BODY=off
  captureBody: true

  # 单个 body 的记录上限（字符）。流式响应同样受此限制
  maxBodyChars: 20000

client:
  # 客户端示例（examples/chat.py）用哪种实现：
  #   true  → 用 openai 包（pip install -r requirements.txt）
  #   false → 用标准库 urllib，零依赖
  # 环境变量：XM2API_USE_OPENAI=0/1
  useOpenAI: true

  # 以下四项是 examples/chat.py 的默认参数，也可以用命令行覆盖
  baseUrl: http://127.0.0.1:18787/v1
  apiKey: xm2api      # 占位；反代不校验这个值
  model: mimo-pro
  maxTokens: 512      # 推理模型建议 ≥512，否则 content 可能是空的
  stream: true
